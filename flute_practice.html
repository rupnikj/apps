<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recorder practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#f3efe6; --card:#fffdf8; --ink:#1e1c19; --muted:#6f6a61; --line:#e2dccf;
  --accent:#2b6fd6; --accent-soft:#dbe7fb; --ok:#2f9e5b; --warn:#d6971c; --bad:#cf4a3f; --miss:#9b968d;
  --chip:#ece7db; --chip-on:#1e1c19; --chip-on-ink:#fff;
  --paper:#fffdf7; --paper-ink:#1e1c19; --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#171614; --card:#211f1c; --ink:#ece8e0; --muted:#a49f95; --line:#3a3731;
    --accent:#6ea0ff; --accent-soft:#233450; --chip:#2e2b26; --chip-on:#ece8e0; --chip-on-ink:#171614; }
}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:1080px;margin:0 auto;padding:12px 14px 40px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
header.top{max-width:1080px;margin:0 auto;padding:12px 14px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-size:20px;margin:0;font-weight:700}
.brand .logo{font-size:26px;line-height:1}
.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--chip);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.right{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px}
.btn.live{border-color:var(--ok);color:var(--ok);background:transparent}
.paper{background:var(--paper);border-radius:10px;padding:6px 4px;overflow-x:auto;border:1px solid var(--line)}
/* By ear: fixed frame – full-width staff on the left, the result in a side panel that is always present, so nothing moves between phrases */
.stagegrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:stretch}
.stage.ear .stagegrid{grid-template-columns:minmax(0,1fr) 300px}
.stage.ear .paper{min-height:172px;display:flex;align-items:center}
.stage.ear #results{margin:0;background:var(--bg);border-color:transparent;min-height:172px;overflow:auto}
.stage.ear #results .res-note{font-size:13px;padding:4px 8px}
@media (max-width:820px){ .stage.ear .stagegrid{grid-template-columns:minmax(0,1fr)} .stage.ear #results{min-height:96px} }
svg#staff{display:block;margin:0 auto;max-width:none}
.sline,.barline,.ledger{stroke:var(--paper-ink);stroke-width:1.1}
.barline.thick{stroke-width:3.6}
.head{fill:var(--paper-ink)}
.head.hollow{fill:var(--paper);stroke:var(--paper-ink);stroke-width:1.8}
.stem{stroke:var(--paper-ink);stroke-width:1.4}
.beam,.flag,.dot,.rest{fill:var(--paper-ink)}
.rest-stroke{fill:none;stroke:var(--paper-ink);stroke-linecap:round;stroke-linejoin:round}
.acc,.clef,.tsig{fill:var(--paper-ink)}
.tsig{font-family:Georgia,"Times New Roman",serif;font-weight:700}
.nm{fill:var(--muted);font-family:inherit;font-weight:600}
.lyr{fill:var(--paper-ink);font-family:inherit}
textarea{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical;margin-top:6px}
.nm.bad{fill:var(--bad)} .nm.warn{fill:var(--warn)} .nm.ok{fill:var(--ok)}
.note.cur .head{fill:var(--accent)} .note.cur .head.hollow{fill:var(--accent-soft);stroke:var(--accent)}
.note.cur .stem,.note.cur .rest-stroke{stroke:var(--accent)} .note.cur .beam,.note.cur .flag,.note.cur .dot,.note.cur .rest,.note.cur .acc{fill:var(--accent)}
.note.ok .head{fill:var(--ok)} .note.ok .head.hollow{fill:var(--paper);stroke:var(--ok)}
.note.ok .stem,.note.ok .rest-stroke{stroke:var(--ok)} .note.ok .beam,.note.ok .flag,.note.ok .dot,.note.ok .rest{fill:var(--ok)}
.note.warn .head{fill:var(--warn)} .note.warn .head.hollow{fill:var(--paper);stroke:var(--warn)}
.note.warn .stem,.note.warn .rest-stroke{stroke:var(--warn)} .note.warn .beam,.note.warn .flag,.note.warn .dot,.note.warn .rest{fill:var(--warn)}
.note.bad .head{fill:var(--bad)} .note.bad .head.hollow{fill:var(--paper);stroke:var(--bad)}
.note.bad .stem,.note.bad .rest-stroke{stroke:var(--bad)} .note.bad .beam,.note.bad .flag,.note.bad .dot,.note.bad .rest{fill:var(--bad)}
.note.miss .head{fill:var(--miss)} .note.miss .head.hollow{fill:var(--paper);stroke:var(--miss)}
.note.miss .stem{stroke:var(--miss)} .note.miss .beam,.note.miss .flag,.note.miss .dot{fill:var(--miss)}
.playhead{stroke:var(--accent);stroke-width:2.2;opacity:.85}
.playhead.listen{stroke-dasharray:5 4}
.ghost .ghead{fill:none;stroke:var(--accent);stroke-width:2.2}
.ghost.ok .ghead{stroke:var(--ok)} .ghost.bad .ghead{stroke:var(--bad)} .ghost.warn .ghead{stroke:var(--warn)}
.ghost .gacc{fill:var(--accent)}
.hide-notes .note{opacity:0}
.stage-head{display:flex;justify-content:space-between;gap:6px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.phaserow{display:flex;align-items:center;gap:10px}
.phase{font-weight:700;font-size:16px}
.help{color:var(--muted);font-size:13px;line-height:1.35;max-width:62ch}
/* microphone status: requested on demand by the first action that needs it; this chip only shows the state (click = ask now) */
.micchip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:2px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.micchip.on{color:var(--ok);border-color:var(--ok);cursor:default}
.monitor{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.mon-block{background:var(--bg);border-radius:10px;padding:8px 12px;min-height:74px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big{font-size:28px;font-weight:700;line-height:1.1;margin:2px 0;min-height:32px}
.stage .actions{margin-top:12px}
.helptext{color:var(--muted);font-size:13px;line-height:1.5;margin-top:8px}
.helptext b{color:var(--ink)}
.big.ok{color:var(--ok)} .big.bad{color:var(--bad)} .big.warn{color:var(--warn)}
.needle-track{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--warn) 30%,var(--ok) 44%,var(--ok) 56%,var(--warn) 70%,var(--bad));opacity:.9;margin:8px 0 4px}
.needle-pin{position:absolute;top:-4px;width:4px;height:18px;background:var(--ink);border-radius:2px;left:50%;transform:translateX(-50%);transition:left .08s}
.small{font-size:12px;color:var(--muted)}
.meter{position:relative;height:10px;background:var(--chip);border-radius:5px;overflow:hidden;margin:6px 0 10px}
#level{height:100%;width:0;background:var(--ok);transition:width .05s}
#gateMark{position:absolute;top:0;width:2px;height:100%;background:var(--ink)}
.beats{display:flex;gap:6px;margin-top:4px}
.beats span{width:14px;height:14px;border-radius:50%;background:var(--chip);display:inline-block}
.beats span.on{background:var(--accent)} .beats span.acc.on{background:var(--ink)}
.msg{margin-top:10px;min-height:22px;font-weight:600}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)} .msg.warn{color:var(--warn)}
canvas#trail{width:100%;height:170px;display:block;margin-top:10px;border-radius:10px;background:var(--bg)}
/* Hero view: falling notes on pitch lanes, drawn from the same run timeline and live scoring as the staff */
canvas#hero{width:100%;height:220px;display:block;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
#stageMain{display:flex;flex-direction:column;gap:10px;min-width:0}
#stageMain.heroonly canvas#hero{height:340px}
.viewsel{display:inline-flex;background:var(--chip);border-radius:999px;padding:2px}
.viewsel button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;cursor:pointer}
.viewsel button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.controls{display:grid;gap:14px}
.group h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.group-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.group-head h2{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:6px 11px;font:inherit;font-weight:600;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px;overflow:hidden}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip.avail{border-color:var(--accent);background:var(--accent-soft)}
.chip.off{opacity:.3;cursor:default}
.chip .mbar{position:absolute;left:0;bottom:0;height:3px;background:var(--ok);width:0}
.chip .ni{width:30px;height:28px;flex:none}
.ni .head,.ni .beam,.ni .flag,.ni .dot,.ni .rest{fill:currentColor}
.ni .stem,.ni .rest-stroke{stroke:currentColor} .ni .head.hollow{fill:none;stroke:currentColor}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:10px}
label.inline{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
select,input[type=number]{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=range]{width:180px;accent-color:var(--accent)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.bpmOut{font-weight:700;min-width:70px;display:inline-block}
.res-notes{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.res-note{border-radius:8px;padding:6px 10px;background:var(--bg);font-size:14px;border-left:4px solid var(--miss)}
.res-note.ok{border-color:var(--ok)} .res-note.bad{border-color:var(--bad)} .res-note.warn{border-color:var(--warn)}
.hints{margin:6px 0 0;padding-left:18px} .hints li{margin:3px 0}
.unlock{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600;color:var(--ok)}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 18px;margin-top:10px}
.set-grid label{display:flex;flex-direction:column;gap:4px;font-size:14px}
.set-grid label.chk{flex-direction:row;align-items:center;gap:8px}
details summary{cursor:pointer;font-weight:700}
.fing{display:flex;gap:6px;margin-top:2px;align-items:center;min-height:0}
.fing svg{width:40px;height:100px}
.fing .fl{fill:none;stroke:var(--ink);stroke-width:1.6} .fing .fc{fill:var(--ink)}
footer{color:var(--muted);font-size:13px;line-height:1.5}
footer b{color:var(--ink)}
[hidden]{display:none!important}
@media (max-width:640px){ .monitor{grid-template-columns:1fr 1fr} .big{font-size:28px} .tabs button{padding:8px 10px;font-size:14px} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">𝄞</span><h1 data-i18n="title">Vaja za kljunasto flavto</h1></div>
  <nav class="tabs" id="tabs">
    <button data-mode="explore" data-i18n="m_explore">Raziskuj</button>
    <button data-mode="flash" data-i18n="m_flash">Kartice</button>
    <button data-mode="echo" data-i18n="m_echo">Ponavljanje</button>
    <button data-mode="ear" data-i18n="m_ear">Po posluhu</button>
    <button data-mode="sight" data-i18n="m_sight">Z lista</button>
    <button data-mode="songs" data-i18n="m_songs">Pesmi</button>
    <button data-mode="long" data-i18n="m_long">Dolgi toni</button>
  </nav>
  <div class="right">
    <button id="langBtn" class="btn small ghost">Slovensko</button>
  </div>
</header>
<main>
  <section class="card stage" id="stage">
    <div class="stage-head"><div class="phaserow"><div id="phase" class="phase"></div><button id="micState" class="micchip" type="button"></button><div class="viewsel" id="viewSel" hidden><button data-view="staff" data-i18n="view_staff"></button><button data-view="both" data-i18n="view_both"></button><button data-view="hero" data-i18n="view_hero"></button></div></div><div id="modeHelp" class="help"></div></div>
    <div class="stagegrid" id="stageGrid">
      <div id="stageMain">
        <div id="staffWrap" class="paper"><svg id="staff" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <canvas id="hero" hidden></canvas>
      </div>
    </div>
    <div class="monitor">
      <div class="mon-block"><div class="lbl" data-i18n="target">Target</div><div id="targetName" class="big">–</div><div id="fingering" class="fing"></div></div>
      <div class="mon-block"><div class="lbl" data-i18n="heard">Heard</div><div id="heardName" class="big">–</div>
        <div class="needle-track"><div id="needle" class="needle-pin"></div></div><div id="centsTxt" class="small">&nbsp;</div></div>
      <div class="mon-block"><div class="lbl" data-i18n="level">Level</div><div class="meter"><div id="level"></div><div id="gateMark"></div></div>
        <div class="lbl" data-i18n="beat">Beat</div><div id="beats" class="beats"></div></div>
    </div>
    <canvas id="trail" hidden></canvas>
    <div class="actions">
      <button id="btnPlay" class="btn primary">Play</button>
      <button id="btnListen" class="btn" data-i18n="btn_listen">Listen</button>
      <button id="btnNew" class="btn" data-i18n="btn_new">New</button>
      <button id="btnStop" class="btn ghost" data-i18n="btn_stop">Stop</button>
      <button id="metroBtn2" class="btn ghost">▶ Metronome</button>
    </div>
    <div id="msg" class="msg"></div>
    <div id="unlock" class="unlock" hidden></div>
  </section>

  <section class="card" id="results" hidden>
    <h2 data-i18n="results" style="margin:0 0 6px;font-size:16px">Results</h2>
    <div id="resRecent" class="small" style="margin-bottom:6px"></div>
    <div id="resSummary"></div>
    <div id="resNotes" class="res-notes"></div>
    <ul id="resHints" class="hints"></ul>
  </section>

  <section class="card controls">
    <div class="group" id="gPool">
      <div class="group-head"><h2 data-i18n="notes">Notes</h2><select id="preset"></select></div>
      <div id="pool" class="chips"></div>
      <div class="small" id="poolHint"></div>
      <div class="row" id="longNav" hidden><button class="btn small" id="longPrev" title="←">‹</button><button class="btn small" id="longNext" title="→">›</button><span class="small" data-i18n="long_nav"></span></div>
    </div>
    <div class="group" id="gSongs">
      <div class="group-head"><h2 data-i18n="songs">Songs</h2><select id="songSel"></select></div>
      <div class="small" id="songMeta"></div>
      <textarea id="songText" rows="3" spellcheck="false"></textarea>
      <div class="small" id="songErr" style="color:var(--bad)"></div>
      <div class="small" data-i18n="song_help"></div>
    </div>
    <div class="group" id="gRhythm">
      <h2 data-i18n="rhythm">Rhythm</h2>
      <div id="rhythm" class="chips"></div>
      <div class="row">
        <label class="inline"><span data-i18n="timesig">Time</span><select data-set="bpb"><option value="4">4/4</option><option value="3">3/4</option><option value="2">2/4</option></select></label>
        <label class="inline"><span data-i18n="bars">Bars</span><select data-set="bars"><option>1</option><option>2</option><option>4</option><option>8</option></select></label>
        <label class="inline"><span data-i18n="maxint">Leaps</span><select data-set="maxInt"><option value="2" data-i18n="int_step"></option><option value="4" data-i18n="int_third"></option><option value="7" data-i18n="int_fifth"></option><option value="99" data-i18n="int_any"></option></select></label>
        <label class="inline"><input type="checkbox" data-set="sync"><span data-i18n="sync"></span></label>
      </div>
    </div>
    <div class="group" id="gTempo">
      <h2 data-i18n="tempo">Tempo</h2>
      <div class="row">
        <input type="range" min="40" max="240" step="2" data-set="bpm"><output class="bpmOut"></output>
        <label class="inline"><input type="checkbox" data-set="countIn"><span data-i18n="countin">Count-in</span></label>
        <label class="inline"><input type="checkbox" data-set="metro"><span data-i18n="metro">Metronome</span></label>
        <label class="inline"><input type="checkbox" data-set="ladder"><span data-i18n="ladder">Tempo ladder</span></label>
      </div>
      <div class="row">
        <label class="inline" id="lPlayAlong"><input type="checkbox" data-set="playAlong"><span data-i18n="playalong"></span></label>
        <label class="inline" id="lHide"><input type="checkbox" data-set="hideNotes"><span data-i18n="hide"></span></label>
        <label class="inline"><input type="checkbox" data-set="autoNext"><span data-i18n="autonext"></span></label>
        <label class="inline"><input type="checkbox" data-set="loop"><span data-i18n="loop"></span></label>
      </div>
    </div>
    <div class="group" id="gMetro">
      <h2 data-i18n="metro">Metronome</h2>
      <div class="row">
        <button id="metroBtn" class="btn small">▶ Metronome</button>
        <label class="inline"><span data-i18n="timesig">Time</span><select data-set="metroBeats"><option value="auto" data-i18n="metro_auto">auto</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>12</option></select><span>/</span><select data-set="metroUnit"><option>2</option><option>4</option><option>8</option></select></label>
        <label class="inline" id="lMetroBpm"><input type="range" min="40" max="240" step="2" data-set="bpm"><output class="bpmOut"></output></label>
      </div>
    </div>
    <div class="group" id="gEar">
      <div class="row"><label class="inline"><span data-i18n="ear_reps"></span><select data-set="earReps"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option></select></label></div>
    </div>
    <div class="group" id="gFlash">
      <div class="row"><label class="inline"><span data-i18n="hint_after"></span><select data-set="hintDelay"><option value="0" data-i18n="never"></option><option value="2">2 s</option><option value="4">4 s</option><option value="8">8 s</option></select></label></div>
    </div>
    <div class="group" id="gLong">
      <div class="row"><label class="inline"><span data-i18n="duration"></span><select data-set="longDur"><option value="4">4 s</option><option value="6">6 s</option><option value="8">8 s</option><option value="12">12 s</option></select></label></div>
    </div>
  </section>

  <details class="card">
    <summary data-i18n="settings">Settings</summary>
    <div class="set-grid">
      <label><span data-i18n="instrument"></span><select data-set="transpose"><option value="12" data-i18n="inst_sop"></option><option value="0" data-i18n="inst_alt"></option></select></label>
      <label><span data-i18n="tol"></span><span><input type="range" min="25" max="90" step="5" data-set="tol"> <output></output></span></label>
      <label><span data-i18n="gate"></span><span><input type="range" min="-70" max="-20" step="1" data-set="gateDb"> <output></output></span></label>
      <label><span data-i18n="latency"></span><span><input type="range" min="0" max="500" step="5" data-set="latency"> <output></output></span></label>
      <div class="chk"><button id="calBtn" class="btn small" data-i18n="calibrate"></button><span class="small" data-i18n="cal_hint"></span></div>
      <div class="chk"><button id="resetStats" class="btn small" data-i18n="reset"></button><span class="small" data-i18n="reset_hint"></span></div>
      <label><span data-i18n="maxbars"></span><select data-set="maxBars"><option>2</option><option>4</option><option>8</option></select></label>
      <label><span data-i18n="lanew"></span><span><input type="range" min="40" max="160" step="10" data-set="laneW"> <output></output></span></label>
      <label class="chk"><input type="checkbox" data-set="ignoreOctave"><span data-i18n="ignoreoct"></span></label>
      <label class="chk"><input type="checkbox" data-set="showNames"><span data-i18n="shownames"></span></label>
      <label class="chk"><input type="checkbox" data-set="showFingering"><span data-i18n="showfing"></span></label>
    </div>
  </details>

  <details class="card">
    <summary data-i18n="helpbox">Help</summary>
    <div id="foot" class="helptext"></div>
  </details>
</main>
<script id="core">
// ===== CORE: pure logic, no DOM (testable in Node) =====
const CORE = (() => {
  const LETTERS = ['C','D','E','F','G','A','B'];
  const LETTER_SEMI = [0,2,4,5,7,9,11];
  // written pitches for a soprano recorder beginner (sounds an octave higher)

// ===== settings & stats =====
const LS_SET='bfp-settings-v3', LS_STATS='bfp-stats-v1';
const DEFAULTS = { lang:'en', mode:'flash', transpose:12, ignoreOctave:false, tol:50, gateDb:-45, latency:40, showFingering:false, showNames:false, maxBars:4,
  song:'prva', songText:'', pool:['A4','C5'], cells:['q','h'], bpb:4, bars:2, maxInt:4, sync:false, view:'staff', laneW:80, bpm:72, metroBeats:'auto', metroUnit:4, earReps:1, countIn:true, metro:true, ladder:false, playAlong:false, hideNotes:false, autoNext:true, loop:false, hintDelay:4, longDur:6, longNote:'G4' };
function loadJSON(k, d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v && typeof v==='object' ? v : d; }catch(e){ return d; } }

const S = Object.assign({}, DEFAULTS, loadJSON(LS_SET, {}));
// optional URL overrides, e.g. ?mode=sight&pool=G4,A4,B4&cells=q,h,ee&bars=4&bpm=80

if(!(S.lang in T_ALL)) S.lang='en';
const stats = {notes: (loadJSON(LS_STATS, {}).notes) || {}};
const saveS = () => saveJSON(LS_SET, S); const saveStats = () => saveJSON(LS_STATS, stats);
const t = (k, ...a) => { const d = T_ALL[S.lang] || T_ALL.en; const v = d[k] ?? T_ALL.en[k] ?? k; return typeof v==='function' ? v(...a) : v; };
// Slovenian names are written pitch as in the school books (lowest soprano note = c¹); English names are the sounding pitch, as a tuner
// shows them (lowest soprano note = C5). Internally every note is the written pitch; the instrument setting supplies the octave.
const nm = n => S.lang==='sl' ? nameSI(n) : nameEN(Object.assign({}, n, {oct:n.oct+S.transpose/12}));
const locale = () => S.lang==='sl' ? 'sl-SI' : 'en-GB';
function todayKey(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const dbToLin = db => Math.pow(10, db/20);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ===== DOM =====
const svg=$('#staff'), staffWrap=$('#staffWrap'), phaseEl=$('#phase'), helpEl=$('#modeHelp'), targetEl=$('#targetName'), heardEl=$('#heardName'),
  needle=$('#needle'), centsTxt=$('#centsTxt'), levelEl=$('#level'), gateMark=$('#gateMark'), beatsEl=$('#beats'), trail=$('#trail'), hero=$('#hero'), msgEl=$('#msg'), fingEl=$('#fingering');

// ===== audio engine =====
const A = {ctx:null, analyser:null, buf:null, micOn:false, master:null, synth:null, metro:null, sched:[], clicks:[], noise:null};
function ensureCtx(){
  if(A.ctx) return A.ctx;
  const ctx = new (window.AudioContext||window.webkitAudioContext)(); A.ctx=ctx;
  A.master=ctx.createGain(); A.master.gain.value=0.9; A.master.connect(ctx.destination);
  A.synth=ctx.createGain(); A.synth.connect(A.master);
  A.metro=ctx.createGain(); A.metro.gain.value=0.5; A.metro.connect(A.master);
  const nb=ctx.createBuffer(1, Math.floor(ctx.sampleRate*0.1), ctx.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; A.noise=nb;
  if(!raf) loop();
  return ctx;
}
async function startMic(){
  const ctx=ensureCtx();
  try{
    await ctx.resume();
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}, video:false});
    const src=ctx.createMediaStreamSource(stream); const an=ctx.createAnalyser(); an.fftSize=2048; an.smoothingTimeConstant=0; src.connect(an);
    A.analyser=an; A.buf=new Float32Array(an.fftSize); A.micOn=true;
    updateMicUI();
    try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
    setMsg(''); if(mode==='flash') flashNext();
  }catch(e){ console.error(e); setMsg(t('mic_err'),'bad'); }
}
// the microphone is asked for by the first action that needs it (Start / Play / Next card); the chip just shows the state
function updateMicUI(){ micState.textContent=(A.micOn?'● ':'○ ')+t(A.micOn?'mic_on':'mic_off'); micState.classList.toggle('on', A.micOn); micState.disabled=A.micOn; btnPlay.hidden = mode==='explore' && A.micOn; }
// simple recorder-like voice: sine partials + breathy chiff
function playTone(midi, at, dur, vol){
  const ctx=A.ctx; const f=440*Math.pow(2,(midi-69)/12);
  const g=ctx.createGain(); const atk=0.025, rel=0.06;
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at+atk);
  g.gain.setValueAtTime(vol, Math.max(at+atk, at+dur-rel)); g.gain.exponentialRampToValueAtTime(0.0001, at+dur+0.01);
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=Math.min(f*5, 9000); lp.connect(g); g.connect(A.synth);
  [[1,1],[2,0.32],[3,0.1],[4,0.035]].forEach(([k,amp])=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*k; const og=ctx.createGain(); og.gain.value=amp; o.connect(og); og.connect(lp); o.start(at); o.stop(at+dur+0.05); o._at=at; A.sched.push(o); });
  const n=ctx.createBufferSource(); n.buffer=A.noise; const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=Math.min(f*2.5, 6000); bp.Q.value=1.2;
  const ng=ctx.createGain(); ng.gain.setValueAtTime(vol*0.5, at); ng.gain.exponentialRampToValueAtTime(0.0001, at+0.06); n.connect(bp); bp.connect(ng); ng.connect(A.synth); n.start(at); n.stop(at+0.08); n._at=at; A.sched.push(n);
}
function click(at, accent, keep){
  const ctx=A.ctx; const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=accent?1900:1400;
  const g=ctx.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(accent?0.8:0.5, at+0.002); g.gain.exponentialRampToValueAtTime(0.0001, at+0.045);
  o.connect(g); g.connect(A.metro); o.start(at); o.stop(at+0.06); o._at=at; if(!keep) A.sched.push(o); A.clicks.push(at);
}
// free-running metronome for every mode (M key toggles it), with its own time signature x/y: x clicks per bar, the first accented,
// one click per y-note. The tempo slider stays the quarter-note tempo, so 6/8 clicks eighths, twice as fast as 6/4 at the same bpm.
const metroFree={on:false, next:0, beat:0, timer:0, sched:[]};
// "auto" follows whatever is on the staff: the song's metre in Songs, the exercise's Time elsewhere
const metroBeats = () => S.metroBeats==='auto' ? ((currentPhrase && currentPhrase.bpb) || S.bpb || 4) : Math.max(1, +S.metroBeats||4);
const metroStep = () => (60/S.bpm)*(4/(+S.metroUnit||4));
function metroFreeStart(){ const ctx=ensureCtx(); ctx.resume(); if(run){ btnStop.click(); } metroFree.on=true; metroFree.next=ctx.currentTime+0.15; metroFree.beat=0; metroFree.sched=[]; metroFreeTick(); metroFree.timer=setInterval(metroFreeTick, 60); updateMetroBtn(); }
function metroFreeStop(){ if(!metroFree.on) return; metroFree.on=false; clearInterval(metroFree.timer); metroFree.timer=0; setBeats(-1, metroBeats()); updateMetroBtn(); }
function metroFreeTick(){ const ctx=A.ctx; while(metroFree.next < ctx.currentTime+0.25){ const b=metroFree.beat%metroBeats(); click(metroFree.next, b===0, true); metroFree.sched.push({t:metroFree.next, b}); metroFree.beat++; metroFree.next+=metroStep(); } if(metroFree.sched.length>64) metroFree.sched.splice(0,32); }
// nothing running redraws the dots, so refresh them whenever the metre can change (song, Time, metronome setting, mode)
function refreshBeats(){ if(!run && !metroFree.on) setBeats(-1, metroBeats()); }
function metroFreeVisual(now){ let cur=-1; for(const c of metroFree.sched){ if(c.t<=now) cur=c.b; else break; } setBeats(cur, metroBeats()); }
// the same toggle sits in the Tempo row (Explore / Flashcards / Long tones) and in the action row of the timed modes
function updateMetroBtn(){ for(const b of [$('#metroBtn'), $('#metroBtn2')]){ b.textContent=(metroFree.on?'■ ':'▶ ')+t('metro'); b.classList.toggle('live', metroFree.on); } }
function stopAudio(){ for(const n of A.sched){ try{ n.stop(); }catch(e){} } A.sched=[]; }
function stopAudioAfter(t){ A.sched=A.sched.filter(n=>{ if(n._at>t){ try{ n.stop(); }catch(e){} return false; } return true; }); }
function nearClick(tm){ for(let i=A.clicks.length-1;i>=0;i--){ const c=A.clicks[i]; if(c<tm-1) break; if(tm-c>-0.03 && tm-c<0.1) return true; } return false; }

// onset detector: attack after silence, sudden level rise (tonguing), or pitch change
const onset = { list:[], hist:[], silent:99, lastM:null, stable:0, committed:null, last:-1,
  reset(){ this.list=[]; this.hist=[]; this.silent=99; this.lastM=null; this.stable=0; this.committed=null; this.last=-1; },
  update(f, gate){
    const loud=f.rms>gate; let hit=false, pitchHit=false;
    if(loud && this.silent>=2) hit=true;
    if(loud && this.hist.length>=4){ const h=this.hist; const mn=Math.min(h[h.length-1],h[h.length-2],h[h.length-3],h[h.length-4]); if(mn>0 && f.rms>1.8*mn) hit=true; }
    const m = f.midi!=null ? Math.round(f.midi) : null;
    if(m!=null){ if(m===this.lastM) this.stable++; else { this.lastM=m; this.stable=1; } if(this.stable===2 && this.committed!==m){ hit=true; pitchHit=true; this.committed=m; } } else this.stable=0;
    if(!loud) this.committed=null;
    if(hit && f.t-this.last>0.08 && !nearClick(f.t)){ this.list.push(f.t-(pitchHit?0.016:0)); this.last=f.t; }
    this.silent = loud ? 0 : this.silent+1; this.hist.push(f.rms); if(this.hist.length>8) this.hist.shift();
  },
  since(t0){ return this.list.filter(x=>x>=t0); }
};

// ===== main loop =====
let raf=0; const heardHist=[];
function loop(){
  raf=requestAnimationFrame(loop); if(!A.ctx) return;
  const ctx=A.ctx, sr=ctx.sampleRate, gate=dbToLin(S.gateDb); let frame;
  if(A.micOn){
    A.analyser.getFloatTimeDomainData(A.buf);
    const r=detectPitch(A.buf, sr, {minF:150, maxF:3200, threshold:0.15, gate});
    frame={t: ctx.currentTime - 1024/sr - S.latency/1000, midi: r.freq? 69+12*Math.log2(r.freq/440) : null, rms:r.rms};

// ===== latency calibration: play clicks through the speakers and time their arrival at the microphone =====
// ===== timing self-test: the app plays eight quarter notes through the speakers and scores its own playing with the very same
// pipeline that scores the learner. Any average "lateness" it finds is pure system lag (speaker + room + microphone + buffering),
// so it is folded into the latency setting. With headphones the microphone hears nothing; then the browser's reported output latency is used.

  if(!A.micOn){ setMsg(t('need_mic'),'bad'); return; }
  cancelAuto(); stopRun(); flash.on=false; metroFreeStop();
  const notes=['A4','C5','A4','C5','A4','C5','A4','C5'].map(n=>BY_NAME[n]);
  const phrase={events:notes.map((n,i)=>({d:1, startBeat:i, bar:i>>2, note:n})), bpb:4, bars:2};
  const saved=currentPhrase; currentPhrase=phrase; lastResult=null; relayout(); hideResults(); setMsg(t('cal_run'));
  const bpm=S.bpm; S.bpm=100;   // fixed test tempo
  const R=buildRun({countIn:true, listen:false, play:true, selftest:true}, A.ctx.currentTime+0.25); S.bpm=bpm;
  R.saved=saved; adoptRun(R);
}

  currentPhrase=R.saved; lastResult=null; relayout(); setPhase('phase_idle');
  const offs=res.items.filter(it=>!it.rest && it.status==='ok' && it.offset!=null).map(it=>it.offset).sort((a,b)=>a-b);
  const heard=res.items.filter(it=>!it.rest && it.status==='ok').length;
  if(offs.length>=3){
    const med=offs[offs.length>>1];

    setMsg(t('cal_ok', heard, res.total, Math.round(med*1000), S.latency),'ok');
  } else {

    if(ol>0){ S.latency=clamp(Math.round((ol*1000+30)/5)*5, 0, 500); S.latMeasured=true; saveS(); syncInputs(); setMsg(t('cal_est', S.latency),'warn'); }
    else setMsg(t('cal_fail'),'bad');
  }
  if(mode==='flash') flashNext();
}

{ let drag=null; hero.addEventListener('pointerdown', e=>{ if(run || !lastResult) return; drag={y:e.clientY, s:heroScroll}; hero.setPointerCapture(e.pointerId); });

  const ppb=(hitY-top)/(currentPhrase.bpb*1.5);   // 1.5 bars visible above the hit line, in every state
  const bw=laneW-6*dpr, bx=li=>x0+li*laneW+3*dpr;   // blocks fill their lane bar a small gap
  let drawn=0, absSum=0, absN=0, pb=0; heroFirstY=null; c.save(); c.beginPath(); c.rect(0,0,W,H-labelH); c.clip();
  // one block: yb/yt = bottom/top edge, it = scoring item, kind = 'play' (yours, coloured by the scoring) | 'listen' (the computer's
  // copy, outlined) | 'next' (the pre-scheduled next pass, faint), pps = pixels per second for the early/late tick
  const block=(e, li, yb, yt, it, kind, cur, pps)=>{
    if(yb<top-2*dpr || yt>H-labelH) return;
    const x=bx(li), w=bw, h=Math.max(yb-yt-2*dpr, 4*dpr);
    if(kind==='listen'){ c.strokeStyle=cssVar('--accent'); c.lineWidth=1.5*dpr; c.globalAlpha=0.7; c.beginPath(); c.roundRect(x+dpr, yt+dpr, w-2*dpr, h, 5*dpr); c.stroke(); }
    else { c.fillStyle = it ? statusColor(it.status==='ok' && it.timing==='slur' ? 'slur' : it.status) : cur ? cssVar('--accent') : cssVar('--chip-on');
      c.globalAlpha = it ? 0.9 : cur ? 0.95 : kind==='next' ? 0.3 : 0.55; c.beginPath(); c.roundRect(x, yt+dpr, w, h, 5*dpr); c.fill(); }
    c.globalAlpha=1; drawn++; if(heroFirstY==null) heroFirstY=yb;
    if(h>=16*dpr){ c.fillStyle = kind==='listen' ? cssVar('--muted') : cssVar('--card'); c.fillText(nm(e.note), x+w/2, yb-h/2); }
    if(it && it.offset!=null && Math.abs(it.offset)>0.03){ const y=yb+it.offset*pps; c.strokeStyle=it.offset>0?cssVar('--warn'):cssVar('--accent'); c.lineWidth=2*dpr; c.beginPath(); c.moveTo(x,y); c.lineTo(x+w,y); c.stroke(); c.fillStyle=cssVar('--ink'); c.font=`${10*dpr}px sans-serif`; c.fillText((it.offset>0?'+':'')+Math.round(it.offset*1000), x+w/2, y+(it.offset>0?7:-7)*dpr); c.font=`${12*dpr}px sans-serif`; }
    if(it && it.offset!=null && it.status==='ok'){ absSum+=Math.abs(it.offset); absN++; }
  };
  const trail=(heard, yOfBeat)=>{ for(const h of heard){ const r=Math.round(h.w); const li=laneIdx.get(r); if(li==null) continue; const y=yOfBeat(h.b); if(y<top||y>hitY+52*dpr) continue;
    const tgt=evs.find(e=>!e.rest && h.b>=e.startBeat && h.b<e.startBeat+e.d); const okm = tgt && tgt.note.midi===r;
    c.fillStyle = hidden ? cssVar('--accent') : okm ? cssVar('--ok') : cssVar('--bad'); c.globalAlpha=0.75; const tw=Math.min(bw*0.5, 40*dpr); c.fillRect(bx(li)+(bw-tw)/2, y-1.5*dpr, tw, 3*dpr); c.globalAlpha=1; } };
  if(onRun){
    // during a run the strip is a time axis, so everything flows through the hit line in order: the computer's copies while you
    // listen, the count-in gap, your copy, and (with Loop) the next pass approaching from above. Tempo changes stretch it live.
    const pps=ppb/R.spb, yT=t=>hitY-(t-now)*pps;
    const copies=[]; const addRun=(Q,next)=>{ if(Q.lb0!=null) for(let k=0;k<Q.lreps;k++) copies.push({Q, b0:Q.lb0+k*Q.lenB, kind:'listen'}); if(Q.pb0!=null) copies.push({Q, b0:Q.pb0, kind: next?'next':'play'}); };
    addRun(R,false); if(R.next && R.next.phrase===currentPhrase) addRun(R.next,true);
    if(!hidden) for(const cp of copies) cp.Q.phrase.events.forEach((e,i)=>{ if(e.rest) return; const li=laneIdx.get(e.note.midi); if(li==null) return;
      const t0=cp.Q.tob(cp.b0+e.startBeat), t1=cp.Q.tob(cp.b0+e.startBeat+e.d); const it = cp.kind==='play' ? (R.liveItems||[]).find(x=>x.i===i) : null;
      block(e, li, yT(t0), yT(t1), it, cp.kind, cp.kind==='play' && now>=t0 && now<t1, pps); });
    if(R.pb0!=null) trail(R.heard, b=>yT(R.tob(R.pb0+b)));
  } else {
    // before a run the first stretch of the phrase waits above the hit line; after a result the pass is reviewed by scrolling
    // (wheel / drag), heroScroll being the beat at the hit line
    pb = lastResult ? clamp(heroScroll, 0, lenB) : 0; const yOf=beat=>hitY-(beat-pb)*ppb, pps=ppb/(60/S.bpm);
    const items=lastResult ? lastResult.items : null;
    if(!hidden) evs.forEach((e,i)=>{ if(e.rest) return; const li=laneIdx.get(e.note.midi); if(li==null) return; block(e, li, yOf(e.startBeat), yOf(e.startBeat+e.d), items ? items.find(it=>it.i===i) : null, 'play', false, pps); });
    trail((heroLast && heroLast.phrase===currentPhrase) ? heroLast.heard : [], yOf);
  }
  c.restore();
  if(!run && lastResult && lenB>0){   // review: position marker on the right edge
    const vis=(hitY-top)/ppb, trackH=hitY-top; c.fillStyle=cssVar('--line'); c.fillRect(W-5*dpr, top, 3*dpr, trackH);
    c.fillStyle=cssVar('--accent'); const th=Math.max(8*dpr, trackH*Math.min(1, vis/(lenB+vis))); c.fillRect(W-5*dpr, top+trackH-th-(trackH-th)*(pb/lenB), 3*dpr, th);
    c.fillStyle=cssVar('--muted'); c.textAlign='left'; c.fillText(t('hero_scroll'), 8*dpr, 14*dpr); c.textAlign='center';
  }
  c.fillStyle=cssVar('--bg'); c.fillRect(0,H-labelH,W,labelH); c.fillStyle=cssVar('--muted'); c.textAlign='center';
  lanes.forEach((ln,i)=>c.fillText(nm(ln), x0+i*laneW+laneW/2, H-labelH/2));
  if(absN){ c.fillStyle=cssVar('--muted'); c.textAlign='right'; c.fillText(t('precision', Math.round(1000*absSum/absN)), W-8*dpr, 14*dpr); c.textAlign='center'; }
  return drawn;
}

// ===== modes & UI wiring =====
function updateButtonLabels(){ updateMetroBtn(); btnPlay.textContent = (mode==='sight'||mode==='songs') ? t('btn_play') : mode==='flash' ? t('btn_next') : t('btn_start'); btnNew.textContent=t('btn_new'); btnListen.textContent = mode==='flash' ? t('btn_hear') : t('btn_listen'); btnStop.textContent=t('btn_stop'); }
function applyMode(){
  flash.on=false; stopRun(); metroFreeStop(); mode=S.mode; saveS();
  // By ear keeps the result (and the unlock line) in a side panel inside the stage; other modes show the result card below the stage
  { const results=$('#results'); $('#stage').classList.toggle('ear', mode==='ear'); if(mode==='ear'){ $('#stageGrid').appendChild(results); results.appendChild(unlockEl); } else { $('#stage').after(results); msgEl.after(unlockEl); } }
  $$('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.mode===mode)); helpEl.textContent=t('help_'+mode);
  const show=(sel,v)=>{ $(sel).hidden=!v; }; const timed = mode==='echo'||mode==='sight'||mode==='ear'; const songs = mode==='songs';
  show('#gPool', !songs); show('#gSongs', songs); show('#gRhythm', timed); show('#gTempo', timed||songs); show('#gMetro', true); show('#gFlash', mode==='flash'); show('#gEar', mode==='ear');
  // the metronome's own time signature is always available; its button and tempo slider only where the action row has none
  $('#metroBtn').hidden = $('#lMetroBpm').hidden = timed||songs;
  heroLast=null; updateView(); refreshBeats(); show('#gLong', mode==='long'); show('#lPlayAlong', mode==='sight'||songs); show('#lHide', mode==='echo');
  btnNew.hidden=!timed; btnListen.hidden=!(timed || songs || mode==='flash'); btnPlay.hidden = mode==='explore' && A.micOn; btnStop.hidden = mode==='explore'; $('#metroBtn2').hidden=!(timed||songs);
  trail.hidden = !(mode==='explore'||mode==='long'); $('#poolHint').textContent = mode==='long' ? t('choose_note') : ''; $('#longNav').hidden = mode!=='long';
  updateButtonLabels(); renderPool(); hideResults(); renderRecent(); unlockEl.hidden=true; setMsg(''); targetEl.textContent='–'; renderFingering(null);
  if(mode==='explore'){ setStaffEmpty(); setPhase('phase_explore'); trailBuf.length=0; drawTrail(A.ctx? A.ctx.currentTime : 0); }
  else if(mode==='flash'){ flashNext(); }
  else if(mode==='long'){ showLongTarget(); setPhase('phase_idle'); }
  else if(mode==='songs'){ renderSongSel(); loadSong(); }
  else newPhrase();
}
function bindInputs(){
  $$('[data-set]').forEach(inp=>{
    const k=inp.dataset.set;
    const apply=()=>{ let v; if(inp.type==='checkbox') v=inp.checked; else { v=inp.value; if(/^-?\d+(\.\d+)?$/.test(v)) v=+v; } S[k]=v; saveS(); refreshOutputs(); onSetting(k); };
    inp.addEventListener(inp.type==='range'?'input':'change', apply);
  });
  syncInputs();
}
function syncInputs(){ $$('[data-set]').forEach(inp=>{ const k=inp.dataset.set; if(inp.type==='checkbox') inp.checked=!!S[k]; else inp.value=String(S[k]); }); refreshOutputs(); }
function refreshOutputs(){
  $$('.bpmOut').forEach(o=>{ o.textContent=S.bpm+' bpm'; });
  $$('input[type=range][data-set]').forEach(inp=>{ const out=inp.parentElement.querySelector('output'); if(!out || inp.dataset.set==='bpm') return; const u={gateDb:' dB', latency:' ms', tol:' ct', laneW:' px'}[inp.dataset.set]||''; out.textContent=inp.value+u; });
}
function onSetting(k){
  switch(k){
    case 'showNames': case 'maxBars': relayout(); break;
    case 'laneW': if(!hero.hidden) drawHero(A.ctx ? A.ctx.currentTime : 0); break;
    case 'metroBeats': case 'metroUnit': if(metroFree.on) metroFree.beat=0; refreshBeats(); break;   // start a fresh bar on the next click
    case 'transpose': applyTexts(); relayout(); if(mode==='flash' && flash.target && (flash.solved||flash.hinted)) revealName(); else if(mode==='long' && long.target) targetEl.textContent=nm(long.target); break;
    case 'showFingering': renderFingering(mode==='flash'? flash.target : mode==='long'? long.target : (curIdx>=0 && L && !L.events[curIdx].rest ? L.events[curIdx].note : null)); break;
    case 'bpb': case 'bars': case 'maxInt': case 'sync':
      if(k==='bpb'){ if(metroFree.on) metroFree.beat=0; refreshBeats(); }   // an "auto" metronome follows the exercise metre
      if(mode==='echo'||mode==='sight'||mode==='ear') newPhrase(); break;
    case 'hideNotes': relayout(); break;
    case 'longDur': if(mode==='long') drawLongGraph(null); break;
    case 'bpm': applyTempo(); break;
  }
}
function applyTexts(){
  document.documentElement.lang=S.lang; document.title=t('title');
  $$('[data-i18n]').forEach(e=>{ e.textContent=t(e.dataset.i18n); });
  $('#foot').innerHTML=t('foot'); langBtn.textContent=t('lang_switch'); updateMicUI();
  helpEl.textContent=t('help_'+mode); updateButtonLabels(); renderPresets(); renderRhythm(); renderSongSel(); renderStats(); if(mode==='songs') loadSong();
}
// switch language in place: labels, note names on the staff and in the monitor, and the current phase text
function setLang(l){
  S.lang=l; saveS(); applyTexts(); setPhase(curPhaseKey); hideResults(); setMsg('');
  if(mode==='flash' && flash.target) targetEl.textContent = (flash.solved||flash.hinted) ? nm(flash.target) : '?';
  else if(mode==='long' && long.target) targetEl.textContent=nm(long.target);
  else if(curIdx>=0 && L && L.events[curIdx] && !L.events[curIdx].rest) targetEl.textContent=nm(L.events[curIdx].note);
  relayout(); if(mode==='flash' && flash.target && (flash.solved||flash.hinted)) revealName();
  checkUnlock(); if(mode==='explore') drawTrail(A.ctx? A.ctx.currentTime : 0);
}
$$('#tabs button').forEach(b=>b.onclick=()=>{ S.mode=b.dataset.mode; applyMode(); });
btnNew.onclick=()=>newPhrase();
btnListen.onclick=()=>{ if(mode==='flash') flashHear(); else startRun({countIn:false, listen:true, play:false}); };
btnPlay.onclick=async()=>{
  if(mode==='explore'){ if(!A.micOn) await startMic(); return; }
  if(!A.micOn){ await startMic(); if(!A.micOn) return; if(mode==='flash') return; }
  if(mode==='flash'){ flashNext(true); return; }
  if(mode==='long'){ longStart(); return; }
  startRun(runOpts());
};
btnStop.onclick=()=>{ if(run && run.opts.selftest){ currentPhrase=run.saved; lastResult=null; stopRun(); relayout(); } else stopRun(); flash.on=false; setPhase('phase_idle'); setMsg(''); };
micState.onclick=()=>{ if(!A.micOn) startMic(); };
langBtn.onclick=()=>setLang(S.lang==='sl' ? 'en' : 'sl');
$('#calBtn').onclick=async()=>{ if(!A.micOn) await startMic(); if(A.micOn) timingTest(); };
$('#longPrev').onclick=()=>longStep(-1); $('#longNext').onclick=()=>longStep(1);
$('#metroBtn').onclick=$('#metroBtn2').onclick=()=>{ if(metroFree.on) metroFreeStop(); else metroFreeStart(); };
$('#songSel').onchange=()=>{ S.song=$('#songSel').value; saveS(); loadSong(); };
let songTimer=0; $('#songText').addEventListener('input', ()=>{ clearTimeout(songTimer); songTimer=setTimeout(()=>{ S.song='custom'; S.songText=$('#songText').value; saveS(); $('#songSel').value='custom'; loadSong(S.songText); }, 300); });
$('#resetStats').onclick=()=>{ if(!confirm(t('reset_confirm'))) return; stats.notes={}; saveStats(); renderStats(); unlockEl.hidden=true; };
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,select,textarea')) return;
  if(e.code==='Space'){ e.preventDefault(); if(run||long.on||autoTimer) btnStop.click(); else btnPlay.click(); }
  else if(e.key==='n' && !btnNew.hidden) btnNew.click();
  else if(e.key==='l' && !btnListen.hidden) btnListen.click();
  else if(e.key==='m') $('#metroBtn').click();
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight') && mode==='long'){ e.preventDefault(); longStep(e.key==='ArrowRight'?1:-1); }
});
let rsz=0; window.addEventListener('resize', ()=>{ clearTimeout(rsz); rsz=setTimeout(()=>{ relayout(); if(mode==='explore') drawTrail(A.ctx? A.ctx.currentTime : 0); if(mode==='long') drawLongGraph(null); if(!hero.hidden) drawHero(A.ctx? A.ctx.currentTime : 0); }, 150); });
$$('#viewSel button').forEach(b=>b.onclick=()=>{ S.view=b.dataset.view; saveS(); updateView(); });
if(document.fonts){ document.fonts.load('40px "Noto Music"').catch(()=>{}).then(()=>relayout()); document.fonts.ready.then(()=>relayout()); }

// init
applyTexts(); bindInputs(); applyMode(); refreshBeats();
// test hook (only with ?debug in the URL): exposes internals for the headless UI harness
if(new URLSearchParams(location.search).has('debug')) window.__app={CORE, S, stats, A, flash, long, onset, timingTest, drawHero, heroLanes, updateView, heroScrollBy, get heroScroll(){ return heroScroll; }, get heroFirstY(){ return heroFirstY; }, get run(){ return run; }, get L(){ return L; }, applyResultColors, showResults, get mode(){ return mode; }, flashNext, flashTick, longStart, longTick, recordNote, renderStats, checkUnlock, setLang, applyMode, renderFingering, FING, nm, t, saveStats, longStep, showLongTarget, startRun, runTick, runOpts, metroFree, metroFreeTick, metroFreeVisual, metroBeats, SONGS, parseSong, loadSong};
})();
</script>
