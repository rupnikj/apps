<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recorder practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#f3efe6; --card:#fffdf8; --ink:#1e1c19; --muted:#6f6a61; --line:#e2dccf;
  --accent:#2b6fd6; --accent-soft:#dbe7fb; --ok:#2f9e5b; --warn:#d6971c; --bad:#cf4a3f; --miss:#9b968d;
  --chip:#ece7db; --chip-on:#1e1c19; --chip-on-ink:#fff;
  --paper:#fffdf7; --paper-ink:#1e1c19; --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#171614; --card:#211f1c; --ink:#ece8e0; --muted:#a49f95; --line:#3a3731;
    --accent:#6ea0ff; --accent-soft:#233450; --chip:#2e2b26; --chip-on:#ece8e0; --chip-on-ink:#171614; }
}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:1080px;margin:0 auto;padding:12px 14px 40px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
header.top{max-width:1080px;margin:0 auto;padding:12px 14px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-size:20px;margin:0;font-weight:700}
.brand .logo{font-size:26px;line-height:1}
.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--chip);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.right{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px}
.btn.live{border-color:var(--ok);color:var(--ok);background:transparent}
.paper{background:var(--paper);border-radius:10px;padding:6px 4px;overflow-x:auto;border:1px solid var(--line)}
svg#staff{display:block;margin:0 auto;max-width:none}
.sline,.barline,.ledger{stroke:var(--paper-ink);stroke-width:1.1}
.barline.thick{stroke-width:3.6}
.head{fill:var(--paper-ink)}
.head.hollow{fill:var(--paper);stroke:var(--paper-ink);stroke-width:1.8}
.stem{stroke:var(--paper-ink);stroke-width:1.4}
.beam,.flag,.dot,.rest{fill:var(--paper-ink)}
.rest-stroke{fill:none;stroke:var(--paper-ink);stroke-linecap:round;stroke-linejoin:round}
.acc,.clef,.tsig{fill:var(--paper-ink)}
.tsig{font-family:Georgia,"Times New Roman",serif;font-weight:700}
.nm{fill:var(--muted);font-family:inherit;font-weight:600}
.nm.bad{fill:var(--bad)} .nm.warn{fill:var(--warn)} .nm.ok{fill:var(--ok)}
.note.cur .head{fill:var(--accent)} .note.cur .head.hollow{fill:var(--accent-soft);stroke:var(--accent)}
.note.cur .stem,.note.cur .rest-stroke{stroke:var(--accent)} .note.cur .beam,.note.cur .flag,.note.cur .dot,.note.cur .rest,.note.cur .acc{fill:var(--accent)}
.note.ok .head{fill:var(--ok)} .note.ok .head.hollow{fill:var(--paper);stroke:var(--ok)}
.note.ok .stem,.note.ok .rest-stroke{stroke:var(--ok)} .note.ok .beam,.note.ok .flag,.note.ok .dot,.note.ok .rest{fill:var(--ok)}
.note.warn .head{fill:var(--warn)} .note.warn .head.hollow{fill:var(--paper);stroke:var(--warn)}
.note.warn .stem,.note.warn .rest-stroke{stroke:var(--warn)} .note.warn .beam,.note.warn .flag,.note.warn .dot,.note.warn .rest{fill:var(--warn)}
.note.bad .head{fill:var(--bad)} .note.bad .head.hollow{fill:var(--paper);stroke:var(--bad)}
.note.bad .stem,.note.bad .rest-stroke{stroke:var(--bad)} .note.bad .beam,.note.bad .flag,.note.bad .dot,.note.bad .rest{fill:var(--bad)}
.note.miss .head{fill:var(--miss)} .note.miss .head.hollow{fill:var(--paper);stroke:var(--miss)}
.note.miss .stem{stroke:var(--miss)} .note.miss .beam,.note.miss .flag,.note.miss .dot{fill:var(--miss)}
.playhead{stroke:var(--accent);stroke-width:2.2;opacity:.85}
.playhead.listen{stroke-dasharray:5 4}
.ghost .ghead{fill:none;stroke:var(--accent);stroke-width:2.2}
.ghost.ok .ghead{stroke:var(--ok)} .ghost.bad .ghead{stroke:var(--bad)} .ghost.warn .ghead{stroke:var(--warn)}
.ghost .gacc{fill:var(--accent)}
.hide-notes .note{opacity:0}
.stage-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.phase{font-weight:700;font-size:16px}
.help{color:var(--muted);font-size:14px}
.monitor{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.mon-block{background:var(--bg);border-radius:10px;padding:10px 12px;min-height:96px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big{font-size:34px;font-weight:700;line-height:1.1;margin:4px 0;min-height:38px}
.big.ok{color:var(--ok)} .big.bad{color:var(--bad)} .big.warn{color:var(--warn)}
.needle-track{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--warn) 30%,var(--ok) 44%,var(--ok) 56%,var(--warn) 70%,var(--bad));opacity:.9;margin:8px 0 4px}
.needle-pin{position:absolute;top:-4px;width:4px;height:18px;background:var(--ink);border-radius:2px;left:50%;transform:translateX(-50%);transition:left .08s}
.small{font-size:12px;color:var(--muted)}
.meter{position:relative;height:10px;background:var(--chip);border-radius:5px;overflow:hidden;margin:6px 0 10px}
#level{height:100%;width:0;background:var(--ok);transition:width .05s}
#gateMark{position:absolute;top:0;width:2px;height:100%;background:var(--ink)}
.beats{display:flex;gap:6px;margin-top:4px}
.beats span{width:14px;height:14px;border-radius:50%;background:var(--chip);display:inline-block}
.beats span.on{background:var(--accent)} .beats span.acc.on{background:var(--ink)}
.msg{margin-top:10px;min-height:22px;font-weight:600}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)} .msg.warn{color:var(--warn)}
canvas#trail{width:100%;height:170px;display:block;margin-top:10px;border-radius:10px;background:var(--bg)}
.controls{display:grid;gap:14px}
.group h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.group-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.group-head h2{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;overflow:hidden}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip .mbar{position:absolute;left:0;bottom:0;height:3px;background:var(--ok);width:0}
.chip .ni{width:30px;height:28px;flex:none}
.ni .head,.ni .beam,.ni .flag,.ni .dot,.ni .rest{fill:currentColor}
.ni .stem,.ni .rest-stroke{stroke:currentColor} .ni .head.hollow{fill:none;stroke:currentColor}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:10px}
label.inline{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
select,input[type=number]{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=range]{width:180px;accent-color:var(--accent)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
#bpmOut{font-weight:700;min-width:70px;display:inline-block}
.res-notes{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.res-note{border-radius:8px;padding:6px 10px;background:var(--bg);font-size:14px;border-left:4px solid var(--miss)}
.res-note.ok{border-color:var(--ok)} .res-note.bad{border-color:var(--bad)} .res-note.warn{border-color:var(--warn)}
.hints{margin:6px 0 0;padding-left:18px} .hints li{margin:3px 0}
.unlock{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600;color:var(--ok)}
.mastery{display:flex;flex-wrap:wrap;gap:8px}
.mrow{background:var(--bg);border-radius:8px;padding:6px 10px;min-width:64px;font-size:13px}
.mrow b{display:block;font-size:15px}
.mrow .bar{height:5px;background:var(--chip);border-radius:3px;margin-top:4px;overflow:hidden}
.mrow .bar i{display:block;height:100%;background:var(--ok)}
.history{margin-top:10px;font-size:13px;color:var(--muted)}
.history div{padding:3px 0;border-top:1px dashed var(--line)}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 18px;margin-top:10px}
.set-grid label{display:flex;flex-direction:column;gap:4px;font-size:14px}
.set-grid label.chk{flex-direction:row;align-items:center;gap:8px}
details summary{cursor:pointer;font-weight:700}
.fing{display:flex;gap:6px;margin-top:2px;align-items:center;min-height:0}
.fing svg{width:40px;height:100px}
.fing .fl{fill:none;stroke:var(--ink);stroke-width:1.6} .fing .fc{fill:var(--ink)}
footer{color:var(--muted);font-size:13px;line-height:1.5}
footer b{color:var(--ink)}
[hidden]{display:none!important}
@media (max-width:640px){ .monitor{grid-template-columns:1fr 1fr} .big{font-size:28px} .tabs button{padding:8px 10px;font-size:14px} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">𝄞</span><h1 data-i18n="title">Vaja za kljunasto flavto</h1></div>
  <nav class="tabs" id="tabs">
    <button data-mode="explore" data-i18n="m_explore">Raziskuj</button>
    <button data-mode="flash" data-i18n="m_flash">Kartice</button>
    <button data-mode="echo" data-i18n="m_echo">Ponavljanje</button>
    <button data-mode="sight" data-i18n="m_sight">Z lista</button>
    <button data-mode="long" data-i18n="m_long">Dolgi toni</button>
  </nav>
  <div class="right">
    <button id="langBtn" class="btn small ghost">Slovensko</button>
    <button id="micBtn" class="btn primary">🎤 <span data-i18n="mic_start">Vklopi mikrofon</span></button>
  </div>
</header>
<main>
  <section class="card stage">
    <div class="stage-head"><div id="phase" class="phase"></div><div id="modeHelp" class="help"></div></div>
    <div id="staffWrap" class="paper"><svg id="staff" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="monitor">
      <div class="mon-block"><div class="lbl" data-i18n="target">Target</div><div id="targetName" class="big">–</div><div id="fingering" class="fing"></div></div>
      <div class="mon-block"><div class="lbl" data-i18n="heard">Heard</div><div id="heardName" class="big">–</div>
        <div class="needle-track"><div id="needle" class="needle-pin"></div></div><div id="centsTxt" class="small">&nbsp;</div></div>
      <div class="mon-block"><div class="lbl" data-i18n="level">Level</div><div class="meter"><div id="level"></div><div id="gateMark"></div></div>
        <div class="lbl" data-i18n="beat">Beat</div><div id="beats" class="beats"></div></div>
    </div>
    <canvas id="trail" hidden></canvas>
    <div id="msg" class="msg"></div>
    <div id="unlock" class="unlock" hidden></div>
  </section>

  <section class="card" id="results" hidden>
    <h2 data-i18n="results" style="margin:0 0 6px;font-size:16px">Results</h2>
    <div id="resSummary"></div>
    <div id="resNotes" class="res-notes"></div>
    <ul id="resHints" class="hints"></ul>
  </section>

  <section class="card controls">
    <div class="group" id="gPool">
      <div class="group-head"><h2 data-i18n="notes">Notes</h2><select id="preset"></select></div>
      <div id="pool" class="chips"></div>
      <div class="small" id="poolHint"></div>
    </div>
    <div class="group" id="gRhythm">
      <h2 data-i18n="rhythm">Rhythm</h2>
      <div id="rhythm" class="chips"></div>
      <div class="row">
        <label class="inline"><span data-i18n="timesig">Time</span><select data-set="bpb"><option value="4">4/4</option><option value="3">3/4</option><option value="2">2/4</option></select></label>
        <label class="inline"><span data-i18n="bars">Bars</span><select data-set="bars"><option>1</option><option>2</option><option>4</option><option>8</option></select></label>
        <label class="inline"><span data-i18n="maxint">Leaps</span><select data-set="maxInt"><option value="2" data-i18n="int_step"></option><option value="4" data-i18n="int_third"></option><option value="7" data-i18n="int_fifth"></option><option value="99" data-i18n="int_any"></option></select></label>
      </div>
    </div>
    <div class="group" id="gTempo">
      <h2 data-i18n="tempo">Tempo</h2>
      <div class="row">
        <input type="range" min="40" max="160" step="2" data-set="bpm"><output id="bpmOut"></output>
        <label class="inline"><input type="checkbox" data-set="countIn"><span data-i18n="countin">Count-in</span></label>
        <label class="inline"><input type="checkbox" data-set="metro"><span data-i18n="metro">Metronome</span></label>
        <label class="inline"><input type="checkbox" data-set="ladder"><span data-i18n="ladder">Tempo ladder</span></label>
      </div>
      <div class="row">
        <label class="inline" id="lPlayAlong"><input type="checkbox" data-set="playAlong"><span data-i18n="playalong"></span></label>
        <label class="inline" id="lHide"><input type="checkbox" data-set="hideNotes"><span data-i18n="hide"></span></label>
        <label class="inline"><input type="checkbox" data-set="autoNext"><span data-i18n="autonext"></span></label>
      </div>
    </div>
    <div class="group" id="gFlash">
      <div class="row"><label class="inline"><span data-i18n="hint_after"></span><select data-set="hintDelay"><option value="0" data-i18n="never"></option><option value="2">2 s</option><option value="4">4 s</option><option value="8">8 s</option></select></label></div>
    </div>
    <div class="group" id="gLong">
      <div class="row"><label class="inline"><span data-i18n="duration"></span><select data-set="longDur"><option value="4">4 s</option><option value="6">6 s</option><option value="8">8 s</option><option value="12">12 s</option></select></label></div>
    </div>
    <div class="actions">
      <button id="btnNew" class="btn" data-i18n="btn_new">New</button>
      <button id="btnListen" class="btn" data-i18n="btn_listen">Listen</button>
      <button id="btnPlay" class="btn primary">Play</button>
      <button id="btnStop" class="btn" data-i18n="btn_stop">Stop</button>
    </div>
  </section>

  <section class="card">
    <div class="group-head"><h2 data-i18n="progress" style="font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)">Progress</h2><button id="resetStats" class="btn ghost small" data-i18n="reset">Reset</button></div>
    <div id="mastery" class="mastery"></div>
    <div class="small" data-i18n="mastery_hint" style="margin-top:6px"></div>
    <div id="extras" class="history"></div>
    <div id="history" class="history"></div>
  </section>

  <details class="card">
    <summary data-i18n="settings">Settings</summary>
    <div class="set-grid">
      <label><span data-i18n="instrument"></span><select data-set="transpose"><option value="12" data-i18n="inst_sop"></option><option value="0" data-i18n="inst_alt"></option></select></label>
      <label><span data-i18n="tol"></span><span><input type="range" min="25" max="90" step="5" data-set="tol"> <output></output></span></label>
      <label><span data-i18n="gate"></span><span><input type="range" min="-70" max="-20" step="1" data-set="gateDb"> <output></output></span></label>
      <label><span data-i18n="latency"></span><span><input type="range" min="0" max="250" step="5" data-set="latency"> <output></output></span></label>
      <div class="chk"><button id="calBtn" class="btn small" data-i18n="calibrate"></button><span class="small" data-i18n="cal_hint"></span></div>
      <label><span data-i18n="maxbars"></span><select data-set="maxBars"><option>2</option><option>4</option><option>8</option></select></label>
      <label class="chk"><input type="checkbox" data-set="ignoreOctave"><span data-i18n="ignoreoct"></span></label>
      <label class="chk"><input type="checkbox" data-set="showNames"><span data-i18n="shownames"></span></label>
      <label class="chk"><input type="checkbox" data-set="showFingering"><span data-i18n="showfing"></span></label>
    </div>
  </details>

  <footer id="foot"></footer>
</main>
<script id="core">
// ===== CORE: pure logic, no DOM (testable in Node) =====
const CORE = (() => {
  const LETTERS = ['C','D','E','F','G','A','B'];
  const LETTER_SEMI = [0,2,4,5,7,9,11];
  // written pitches for a soprano recorder beginner (sounds an octave higher)
  const CATALOG_NAMES = ['C4','D4','E4','F4','F#4','G4','A4','Bb4','B4','C5','C#5','D5','E5','F5','F#5','G5','A5'];

  function parseNote(name){
    const m = /^([A-G])(#|b)?(\d)$/.exec(name); if(!m) throw new Error('bad note '+name);
    const li = LETTERS.indexOf(m[1]); const acc = m[2]==='#'?1:m[2]==='b'?-1:0; const oct = +m[3];
    return {name, li, acc, oct, step:(oct-4)*7+li, midi:12*(oct+1)+LETTER_SEMI[li]+acc};
  }
  const CATALOG = CATALOG_NAMES.map(parseNote);
  const BY_NAME = Object.fromEntries(CATALOG.map(n=>[n.name,n]));
  const SPELL = [[0,0],[0,1],[1,0],[1,1],[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[6,-1],[6,0]];
  function noteFromMidi(m){
    const hit = CATALOG.find(n=>n.midi===m); if(hit) return hit;
    const pc = ((m%12)+12)%12, oct = Math.floor(m/12)-1; const [li,acc] = SPELL[pc];
    return {name: LETTERS[li]+(acc===1?'#':acc===-1?'b':'')+oct, li, acc, oct, step:(oct-4)*7+li, midi:m};
  }
  // Slovenian school notation: same letters as German (h, fis, b), octave as superscript number: c¹ h¹ c² d²
  const SUP = ['','¹','²','³','⁴','⁵'];
  function nameEN(n){ return LETTERS[n.li] + (n.acc===1?'♯':n.acc===-1?'♭':'') + n.oct; }
  function nameSI(n){
    let l = n.li===6 ? (n.acc===-1?'b':'h') : LETTERS[n.li].toLowerCase();
    if(n.acc===1) l += 'is'; else if(n.acc===-1 && n.li!==6) l += (n.li===2||n.li===5)?'s':'es';
    const k = n.oct-3;
    return k>=1 ? l + (SUP[k]||('^'+k)) : k===0 ? l : l.toUpperCase();
  }

  const PRESETS = [
    {id:'s1', notes:['G4','A4','B4']},
    {id:'s2', notes:['G4','A4','B4','C5']},
    {id:'s3', notes:['G4','A4','B4','C5','D5']},
    {id:'s4', notes:['D4','E4','G4','A4','B4','C5','D5']},
    {id:'s5', notes:['C4','D4','E4','G4','A4','B4','C5','D5']},
    {id:'s6', notes:['C4','D4','E4','F4','G4','A4','B4','C5','D5']},
    {id:'s7', notes:['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5']},
    {id:'s8', notes:['C4','D4','E4','F4','F#4','G4','A4','Bb4','B4','C5','D5','E5','F5','F#5','G5']},
    {id:'all', notes:CATALOG_NAMES.slice()},
  ];

  // rhythm cells: length in beats (quarter = 1)
  const CELLS = {
    w:  {len:4, items:[{d:4}]},
    hd: {len:3, items:[{d:3, dot:true}]},
    h:  {len:2, items:[{d:2}]},
    qde:{len:2, items:[{d:1.5, dot:true},{d:0.5, flag:true}]},
    q:  {len:1, items:[{d:1}]},
    ee: {len:1, items:[{d:0.5, beam:1},{d:0.5, beam:2}]},
    qr: {len:1, items:[{d:1, rest:true}]},
    hr: {len:2, items:[{d:2, rest:true}]},
  };
  const CELL_ORDER = ['w','hd','h','q','ee','qde','qr','hr'];
  const CELL_WEIGHT = {w:1, hd:1.2, h:2, qde:1.4, q:3, ee:2, qr:0.8, hr:0.4};
  function cellAllowedAt(id, pos, bpb){
    const len = CELLS[id].len; if(pos+len > bpb) return false;
    switch(id){
      case 'w': return bpb===4 && pos===0;
      case 'hd': return (bpb===3 && pos===0) || (bpb===4 && pos<=1);
      case 'h': case 'hr': case 'qde': return bpb===4 ? pos%2===0 : bpb===3 ? pos<=1 : pos===0;
      default: return true;
    }
  }
  function pickWeighted(items, weights, rnd){
    let tot=0; for(const w of weights) tot+=w;
    if(!(tot>0)) return items[Math.floor(rnd()*items.length)];

  // ---- layout (staff-space units → px) ----
  const SLOT = {4:8, 3:6.8, 2:5.4, 1.5:4.6, 1:3.6, 0.5:2.4};
  // o: {sp, width, maxBars, center, noTimeSig}

  // ---- YIN pitch detection ----

    const tauMin=Math.max(2,Math.floor(sr/maxF)); const tauMax=Math.min(Math.floor(sr/minF), N>>1);
    if(_n!==tauMax+1){ _d=new Float32Array(tauMax+1); _c=new Float32Array(tauMax+1); _n=tauMax+1; }

    if(tau<0){ let best=tauMin; for(let t=tauMin;t<=tauMax;t++) if(_c[t]<_c[best]) best=t; if(_c[best]>0.45) return {freq:null,rms,clarity:1-_c[best]}; tau=best; }

    return {freq: sr/est, rms, clarity: 1-_c[tau]};
  }

  // ---- scoring ----
  // o: {frames:[{t,midi,rms}], onsets:[t], T0, spb, transpose, ignoreOctave, tol (cents), gate}
  // scores one event; only needs frames up to the end of that event, so it can run live while the phrase is still playing
  function scoreEvent(events, i, o){

      const target = ev.note.midi + transpose;

})();

// Source: Mollenhauer "Deutsche Griffweise" chart; fis'' shown with hole 6 half-closed as in that chart

// ===== echo / sight-reading runs =====

  if(o.countIn){ R.count0=tm; for(let b=0;b<bpb;b++) click(tm+b*spb, b===0); tm+=barDur; }
  if(o.listen){ R.listen0=tm; if(S.metro) for(let b=0;b<currentPhrase.bars*bpb;b++) click(tm+b*spb, b%bpb===0); scheduleNotes(tm, spb, 0.28); tm+=len; }

function runTick(frame){

  if(R.listen0!=null && now<R.listen0+R.len){ setPhase('phase_listen'); const beat=(now-R.listen0)/R.spb; setBeats(Math.floor(beat)%R.bpb, R.bpb); setPlayhead(beat,'listen'); return; }

function scoreOpts(R){ return {frames:R.frames, onsets:onset.since(R.play0-0.3), T0:R.play0, spb:R.spb, transpose:S.transpose, ignoreOctave:S.ignoreOctave, tol:S.tol, gate:dbToLin(S.gateDb)}; }

  cancelAuto();

    recordNote(flash.target.name, false); saveStats(); renderStats(); }
  stopRun();

  const prev=flash.target; flash.target=pickWeighted(cand, cand.map(n=>wk[n.name]), Math.random);
  currentPhrase={events:[{d:1,startBeat:0,bar:0,note:flash.target}], bpb:4, bars:1}; lastResult=null; relayout();
  Object.assign(flash,{on:true, prevTarget:prev, shownAt: A.ctx? A.ctx.currentTime : 0, armed:false, matchStart:null, wrongSince:null, hadWrong:false, wrongNote:null, hinted:false, live:false, muteUntil:0, solved:false});

function flashHear(){
  if(!flash.on || !flash.target || flash.solved) return; const ctx=ensureCtx(); ctx.resume(); const at=ctx.currentTime+0.05;
  playTone(flash.target.midi+S.transpose, at, 0.9, 0.3); flash.hinted=true; flash.muteUntil=at+1.3; flash.matchStart=null; flash.wrongSince=null;
}
function flashTick(f){
  if(!flash.on || !A.micOn || flash.solved || !L.events.length) return;
  flash.live=true;
  if(A.ctx.currentTime<flash.muteUntil){ setGhost(null); return; }
  const tgt=flash.target.midi; const w = f.midi!=null ? f.midi-S.transpose : null; const match = w!=null && isMatch(w,tgt); const e=L.events[0];
  if(w!=null) setGhost(w, e.x+2.8*L.sp, e.top); else setGhost(null);
  // arm only after silence or a pitch other than the previous card's note, so a note still held from the last card is not judged
  if(!flash.armed){ const silent = w==null || f.rms<dbToLin(S.gateDb); if(silent || !flash.prevTarget || !isMatch(w, flash.prevTarget.midi)) flash.armed=true; else return; }
  if(match){
    flash.wrongSince=null; if(flash.matchStart==null) flash.matchStart=f.t;
    if(f.t-flash.matchStart>=0.25){
      flash.solved=true; const rt=Math.max(0, flash.matchStart-flash.shownAt); const ok = !flash.hadWrong && !flash.hinted && rt<3;
      recordNote(flash.target.name, ok); recordRT(flash.target.name, rt); if(flash.wrongNote) recordConf(flash.target.name, flash.wrongNote);
      saveStats();
      noteEls[0].classList.add(ok?'ok':'warn'); revealName();
      if(ok) setMsg(t('flash_ok'),'ok'); else if(flash.hadWrong) setMsg(t('flash_after_wrong', fmtName(flash.wrongNote)),'warn'); else if(flash.hinted) setMsg(t('flash_hinted'),'warn'); else setMsg(t('flash_slow'),'warn');
      renderStats(); checkUnlock(); setTimeout(()=>{ if(flash.on && flash.solved) flashNext(); }, ok?800:1600);
    }
  } else {
    flash.matchStart=null;
    if(w!=null){ if(flash.wrongSince==null) flash.wrongSince=f.t; else if(f.t-flash.wrongSince>0.4 && !flash.hadWrong){ flash.hadWrong=true; flash.wrongNote=noteFromMidi(Math.round(w)).name; setMsg(t('flash_that', fmtName(flash.wrongNote)),'bad'); } }
    else flash.wrongSince=null;
  }
}

// ===== long tones =====
function showLongTarget(){
  const n=BY_NAME[S.longNote]||BY_NAME.G4; long.target=n;
  currentPhrase={events:[{d:4,startBeat:0,bar:0,note:n}], bpb:4, bars:1}; lastResult=null; relayout();
  targetEl.textContent=nm(n); renderFingering(n); long.samples=[]; drawLongGraph(null);
}
function longStart(){
  if(!A.micOn){ setMsg(t('need_mic'),'bad'); return; }
  stopRun(); long.on=true; long.t0=null; long.wait0=A.ctx.currentTime; long.samples=[]; setPhase('phase_long_wait'); setMsg(''); hideResults(); if(noteEls[0]) noteEls[0].classList.remove('ok','warn','bad'); drawLongGraph(null);
}
// the clock starts at the first sound, not at the click, so breathing in is not counted against the tone
function longTick(f){
  if(!long.on) return; const now=A.ctx.currentTime; const e=L.events[0];
  if(f.midi!=null) setGhost(f.midi-S.transpose, e.x+2.8*L.sp, e.top); else setGhost(null);
  if(long.t0==null){
    if(f.midi!=null && f.rms>dbToLin(S.gateDb)){ long.t0=now; setPhase('phase_long'); }
    else { if(now-long.wait0>12){ long.on=false; setGhost(null); setPhase('phase_idle'); setMsg(t('long_nosound'),'bad'); } return; }
  }
  const elapsed=now-long.t0; if(elapsed>S.longDur){ longFinish(); return; }
  let c=null; if(f.midi!=null){ let d=f.midi-S.transpose-long.target.midi; if(S.ignoreOctave) d=((d+6)%12+12)%12-6; c=d*100; }
  long.samples.push({t:elapsed, c}); drawLongGraph(elapsed);
}
function longFinish(){
  long.on=false; setGhost(null);
  const all=long.samples.length; const s=long.samples.filter(x=>x.c!=null && Math.abs(x.c)<=100);
  const inBand=s.filter(x=>Math.abs(x.c)<=15).length; const pct = all? Math.round(100*inBand/all) : 0;
  const mean = s.length? s.reduce((a,x)=>a+x.c,0)/s.length : 0; const sd = s.length? Math.sqrt(s.reduce((a,x)=>a+(x.c-mean)**2,0)/s.length) : 0;
  const hints=[]; if(mean>15) hints.push(t('hint_sharp')); if(mean<-15) hints.push(t('hint_flat')); if(sd>18) hints.push(t('hint_wobble')); if(s.length<all*0.5) hints.push(t('hint_missing')); if(pct>=80 && !hints.length) hints.push(t('hint_clean'));
  $('#results').hidden=false; $('#resSummary').innerHTML=`<b>${nm(long.target)}</b> · ${t('long_res', pct, Math.round(mean), Math.round(sd))}`; $('#resNotes').innerHTML='';
  const ul=$('#resHints'); ul.innerHTML=''; hints.forEach(h=>{ const li=document.createElement('li'); li.textContent=h; ul.appendChild(li); });
  if(noteEls[0]) noteEls[0].classList.add(pct>=80?'ok':pct>=50?'warn':'bad');
  stats.history.unshift({d:Date.now(), mode:'long', score:pct+'%', pool:[long.target.name]}); stats.history.length=Math.min(stats.history.length,30); saveStats(); renderStats(); setPhase('phase_res');
}
function trailCtx(){ const dpr=devicePixelRatio||1; const w=trail.clientWidth, h=trail.clientHeight; if(trail.width!==Math.round(w*dpr)||trail.height!==Math.round(h*dpr)){ trail.width=Math.round(w*dpr); trail.height=Math.round(h*dpr); } return trail.getContext('2d'); }
function drawLongGraph(elapsed){
  if(trail.hidden) return; const c=trailCtx(), W=trail.width, H=trail.height, dpr=devicePixelRatio||1; c.clearRect(0,0,W,H);
  const range=60; const yOf=v=>H/2 - clamp(v,-range,range)/range*(H/2-6*dpr);
  c.fillStyle=cssVar('--ok'); c.globalAlpha=0.18; c.fillRect(0,yOf(15),W,yOf(-15)-yOf(15)); c.globalAlpha=1;
  c.strokeStyle=cssVar('--muted'); c.lineWidth=dpr; c.beginPath(); c.moveTo(0,H/2); c.lineTo(W,H/2); c.stroke();
  c.fillStyle=cssVar('--muted'); c.font=`${11*dpr}px sans-serif`; c.fillText('+50 ct', 6*dpr, yOf(50)+4*dpr); c.fillText('−50 ct', 6*dpr, yOf(-50)+4*dpr);
  c.strokeStyle=cssVar('--accent'); c.lineWidth=2.5*dpr; c.beginPath(); let pen=false;
  for(const s of long.samples){ if(s.c==null||Math.abs(s.c)>100){ pen=false; continue; } const x=s.t/S.longDur*W, y=yOf(s.c); if(!pen){ c.moveTo(x,y); pen=true; } else c.lineTo(x,y); }
  c.stroke();
  if(elapsed!=null){ c.strokeStyle=cssVar('--ink'); c.globalAlpha=0.5; c.beginPath(); const x=elapsed/S.longDur*W; c.moveTo(x,0); c.lineTo(x,H); c.stroke(); c.globalAlpha=1; }
}

// ===== explore =====
function exploreTick(f){
  const now=A.ctx.currentTime; trailBuf.push({t:now, m: f.midi!=null? f.midi-S.transpose : null}); while(trailBuf.length && now-trailBuf[0].t>6) trailBuf.shift();
  if(L && L.systems[0]){ const sys=L.systems[0]; if(f.midi!=null) setGhost(f.midi-S.transpose, (sys.x0+sys.x1)/2+2*L.sp, sys.top); else setGhost(null); }
  drawTrail(now);
}
function drawTrail(now){
  if(trail.hidden) return; const c=trailCtx(), W=trail.width, H=trail.height, dpr=devicePixelRatio||1; c.clearRect(0,0,W,H);
  const pool=poolNotes(); let lo=Math.min(...pool.map(n=>n.midi))-2, hi=Math.max(...pool.map(n=>n.midi))+2;
  for(const s of trailBuf) if(s.m!=null){ lo=Math.min(lo, Math.floor(s.m)-1); hi=Math.max(hi, Math.ceil(s.m)+1); }
  const yOf=m=> H-8*dpr - (m-lo)/(hi-lo)*(H-16*dpr); const x0=44*dpr;
  c.font=`${11*dpr}px sans-serif`;
  let lastY=-1e9;
  for(const n of pool){ const y=yOf(n.midi); c.strokeStyle=cssVar('--line'); c.lineWidth=dpr; c.beginPath(); c.moveTo(x0,y); c.lineTo(W-x0,y); c.stroke(); c.fillStyle=cssVar('--muted');
    const right = Math.abs(y-lastY)<16*dpr; c.textAlign = right?'right':'left'; c.fillText(nm(n), right? W-6*dpr : 6*dpr, y+4*dpr); lastY = right? -1e9 : y; }
  c.textAlign='left';
  c.fillStyle=cssVar('--accent');
  for(const s of trailBuf){ if(s.m==null) continue; const x=x0+(1-(now-s.t)/6)*(W-x0), y=yOf(s.m); c.beginPath(); c.arc(x,y,2.2*dpr,0,Math.PI*2); c.fill(); }
}

// ===== latency calibration: play clicks through the speakers and time their arrival at the microphone =====
function calibrateLatency(){
  if(!A.micOn){ setMsg(t('need_mic'),'bad'); return; }
  stopRun(); flash.on=false; const ctx=A.ctx; const t0=ctx.currentTime+0.4; cal.frames=[]; cal.clicks=[];
  for(let i=0;i<6;i++){ const at=t0+i*0.5; click(at, true); cal.clicks.push(at); }
  cal.end=t0+3.4; cal.on=true; setMsg(t('cal_run'));
}
function calTick(now){
  if(now<cal.end) return; cal.on=false;
  const gate=dbToLin(S.gateDb); const delays=[];
  for(const c of cal.clicks){
    const base=cal.frames.filter(f=>f.t>=c-0.25 && f.t<c-0.03).map(f=>f.rms).sort((a,b)=>a-b); const b=base.length ? base[base.length>>1] : 0;
    const thr=Math.max(b*3, gate, 0.003);
    const hit=cal.frames.find(f=>f.t>=c-0.03 && f.t<=c+0.4 && f.rms>thr); if(hit) delays.push(Math.max(0, hit.t-c));
  }
  if(mode==='flash') flashNext();
  if(delays.length<3){ setMsg(t('cal_fail'),'bad'); return; }
  delays.sort((a,b)=>a-b); const med=delays[delays.length>>1];
  S.latency=clamp(Math.round(med*1000/5)*5, 0, 250); saveS(); syncInputs(); setMsg(t('cal_ok', S.latency),'ok');
}

// ===== modes & UI wiring =====
function updateButtonLabels(){ btnPlay.textContent = mode==='sight' ? t('btn_play') : mode==='flash' ? t('btn_next') : t('btn_start'); btnNew.textContent=t('btn_new'); btnListen.textContent = mode==='flash' ? t('btn_hear') : t('btn_listen'); btnStop.textContent=t('btn_stop'); }
function applyMode(){
  flash.on=false; stopRun(); mode=S.mode; saveS();
  $$('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.mode===mode)); helpEl.textContent=t('help_'+mode);
  const show=(sel,v)=>{ $(sel).hidden=!v; }; const timed = mode==='echo'||mode==='sight';
  show('#gRhythm', timed); show('#gTempo', timed); show('#gFlash', mode==='flash'); show('#gLong', mode==='long'); show('#lPlayAlong', mode==='sight'); show('#lHide', mode==='echo');
  btnNew.hidden=!timed; btnListen.hidden=!(timed || mode==='flash'); btnPlay.hidden = mode==='explore'; btnStop.hidden = mode==='explore';
  trail.hidden = !(mode==='explore'||mode==='long'); $('#poolHint').textContent = mode==='long' ? t('choose_note') : '';
  updateButtonLabels(); renderPool(); hideResults(); unlockEl.hidden=true; setMsg(''); targetEl.textContent='–'; renderFingering(null);
  if(mode==='explore'){ setStaffEmpty(); setPhase('phase_explore'); trailBuf.length=0; drawTrail(A.ctx? A.ctx.currentTime : 0); }
  else if(mode==='flash'){ flashNext(); }
  else if(mode==='long'){ showLongTarget(); setPhase('phase_idle'); }
  else newPhrase();
}
function bindInputs(){
  $$('[data-set]').forEach(inp=>{
    const k=inp.dataset.set;
    const apply=()=>{ let v; if(inp.type==='checkbox') v=inp.checked; else { v=inp.value; if(/^-?\d+(\.\d+)?$/.test(v)) v=+v; } S[k]=v; saveS(); refreshOutputs(); onSetting(k); };
    inp.addEventListener(inp.type==='range'?'input':'change', apply);
  });
  syncInputs();
}
function syncInputs(){ $$('[data-set]').forEach(inp=>{ const k=inp.dataset.set; if(inp.type==='checkbox') inp.checked=!!S[k]; else inp.value=String(S[k]); }); refreshOutputs(); }
function refreshOutputs(){
  $('#bpmOut').textContent=S.bpm+' bpm';
  $$('input[type=range][data-set]').forEach(inp=>{ const out=inp.parentElement.querySelector('output'); if(!out || inp.dataset.set==='bpm') return; const u={gateDb:' dB', latency:' ms', tol:' ct'}[inp.dataset.set]||''; out.textContent=inp.value+u; });
}
function onSetting(k){
  switch(k){
    case 'showNames': case 'maxBars': relayout(); break;
    case 'showFingering': renderFingering(mode==='flash'? flash.target : mode==='long'? long.target : (curIdx>=0 && L && !L.events[curIdx].rest ? L.events[curIdx].note : null)); break;
    case 'bpb': case 'bars': case 'maxInt': if(mode==='echo'||mode==='sight') newPhrase(); break;
    case 'hideNotes': relayout(); break;
    case 'longDur': if(mode==='long') drawLongGraph(null); break;
  }
}
function applyTexts(){
  document.documentElement.lang=S.lang; document.title=t('title');
  $$('[data-i18n]').forEach(e=>{ e.textContent=t(e.dataset.i18n); });
  $('#foot').innerHTML=t('foot'); langBtn.textContent=t('lang_switch');
  micBtn.innerHTML='🎤 '+(A.micOn? t('mic_on') : t('mic_start'));
  helpEl.textContent=t('help_'+mode); updateButtonLabels(); renderPresets(); renderRhythm(); renderStats();
}
// switch language in place: labels, note names on the staff and in the monitor, and the current phase text
function setLang(l){
  S.lang=l; saveS(); applyTexts(); setPhase(curPhaseKey); hideResults(); setMsg('');
  if(mode==='flash' && flash.target) targetEl.textContent = (flash.solved||flash.hinted) ? nm(flash.target) : '?';
  else if(mode==='long' && long.target) targetEl.textContent=nm(long.target);
  else if(curIdx>=0 && L && L.events[curIdx] && !L.events[curIdx].rest) targetEl.textContent=nm(L.events[curIdx].note);
  relayout(); if(mode==='flash' && flash.target && (flash.solved||flash.hinted)) revealName();
  checkUnlock(); if(mode==='explore') drawTrail(A.ctx? A.ctx.currentTime : 0);
}
$$('#tabs button').forEach(b=>b.onclick=()=>{ S.mode=b.dataset.mode; applyMode(); });
btnNew.onclick=()=>newPhrase();
btnListen.onclick=()=>{ if(mode==='flash') flashHear(); else startRun({countIn:false, listen:true, play:false}); };
btnPlay.onclick=async()=>{
  if(mode==='explore') return;
  if(!A.micOn){ await startMic(); if(!A.micOn) return; if(mode==='flash') return; }
  if(mode==='flash'){ flashNext(true); return; }
  if(mode==='long'){ longStart(); return; }
  startRun(runOpts());
};
btnStop.onclick=()=>{ stopRun(); flash.on=false; cal.on=false; setPhase('phase_idle'); setMsg(''); };
micBtn.onclick=()=>startMic();
langBtn.onclick=()=>setLang(S.lang==='sl' ? 'en' : 'sl');
$('#calBtn').onclick=()=>calibrateLatency();
$('#resetStats').onclick=()=>{ if(!confirm(t('reset_confirm'))) return; stats.notes={}; stats.history=[]; stats.conf={}; stats.best={}; saveStats(); renderStats(); unlockEl.hidden=true; };
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,select,textarea')) return;
  if(e.code==='Space'){ e.preventDefault(); if(run||long.on||autoTimer||cal.on) btnStop.click(); else btnPlay.click(); }
  else if(e.key==='n' && !btnNew.hidden) btnNew.click();
  else if(e.key==='l' && !btnListen.hidden) btnListen.click();
});
let rsz=0; window.addEventListener('resize', ()=>{ clearTimeout(rsz); rsz=setTimeout(()=>{ relayout(); if(mode==='explore') drawTrail(A.ctx? A.ctx.currentTime : 0); if(mode==='long') drawLongGraph(null); }, 150); });
if(document.fonts){ document.fonts.load('40px "Noto Music"').catch(()=>{}).then(()=>relayout()); document.fonts.ready.then(()=>relayout()); }

// init
applyTexts(); bindInputs(); setBeats(-1, S.bpb); applyMode();
// test hook (only with ?debug in the URL): exposes internals for the headless UI harness
if(new URLSearchParams(location.search).has('debug')) window.__app={CORE, S, stats, A, flash, long, cal, get run(){ return run; }, get L(){ return L; }, applyResultColors, showResults, get mode(){ return mode; }, flashNext, flashTick, longStart, longTick, recordNote, renderStats, checkUnlock, setLang, applyMode, renderFingering, FING, nm, t, saveStats};
})();
