<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Face Chords</title>
<style>
  :root {
    --bg:#0d0a16;
    --panel:#161126;
    --edge:#2a2145;
    --maj:#ffb545;
    --min:#5b8dff;
    --sus:#b06bff;
    --text:#e8e4f2;
    --dim:#7d7693;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden;
    background:radial-gradient(ellipse 90% 60% at 50% 0%, #1a1330, var(--bg) 70%);
    font-family:system-ui, sans-serif;
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
  }
  body { display:flex; flex-direction:column; }

  /* ---- top: camera + expression ---- */
  #top {
    flex:0 0 auto;
    display:flex; gap:12px; align-items:center;
    padding:10px 14px 6px;
  }
  #cam {
    width:96px; height:128px;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    border:2px solid var(--edge);
    position:relative;
    flex:0 0 auto;
  }
  #video {
    width:100%; height:100%;
    object-fit:cover;
    transform:scaleX(-1);
  }
  #camstate {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:var(--dim); text-align:center; padding:6px;
    background:rgba(0,0,0,0.5);
  }
  #camstate.hidden { display:none; }
  #expr { flex:1; display:flex; flex-direction:column; gap:8px; }
  #quality {
    font-size:30px; font-weight:800; letter-spacing:0.06em;
    display:flex; align-items:baseline; gap:10px;
  }
  #quality .face { font-size:34px; }
  #quality.MAJOR { color:var(--maj); text-shadow:0 0 18px rgba(255,181,69,0.4); }
  #quality.MINOR { color:var(--min); text-shadow:0 0 18px rgba(91,141,255,0.4); }
  #quality.SUS   { color:var(--sus); text-shadow:0 0 18px rgba(176,107,255,0.4); }
  #moodtrack {
    height:12px; border-radius:6px;
    background:linear-gradient(90deg, var(--min), var(--sus) 50%, var(--maj));
    position:relative;
    border:1px solid var(--edge);
  }
  #moodcursor {
    position:absolute; top:-4px; width:4px; height:20px;
    background:#fff; border-radius:2px;
    left:50%; transform:translateX(-50%);
    box-shadow:0 0 8px rgba(255,255,255,0.7);
  }
  #moodlabels { display:flex; justify-content:space-between; font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); }

  /* ---- arp panel ---- */
  #arp {
    flex:0 0 auto;
    display:flex; gap:8px; align-items:stretch;
    padding:6px 14px 8px;
  }
  .apod {
    background:var(--panel); border:1px solid var(--edge); border-radius:10px;
    padding:6px 10px;
    display:flex; flex-direction:column; gap:2px;
    flex:1;
  }
  .apod label { font-size:8px; letter-spacing:0.16em; text-transform:uppercase; color:var(--dim);
    display:flex; justify-content:space-between; }
  .apod label output { color:var(--text); font-family:ui-monospace,monospace; }
  #arp-toggle {
    flex:0 0 auto;
    padding:0 18px;
    font-size:12px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase;
    background:var(--panel); color:var(--dim);
    border:1px solid var(--edge); border-radius:10px;
  }
  #arp-toggle.on {
    color:#0d0a16; background:linear-gradient(135deg, var(--sus), var(--min));
    border-color:transparent;
  }
  input[type=range] { -webkit-appearance:none; width:100%; height:24px; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track {
    height:4px; background:#000; border:1px solid var(--edge); border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:20px; height:20px; margin-top:-9px;
    background:radial-gradient(circle at 35% 30%, #d9c9ff, var(--sus) 75%);
    border:1px solid #000; border-radius:50%;
  }

  /* ---- chord pads ---- */
  #pads {
    flex:1 1 auto;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    grid-auto-rows:1fr;
    gap:8px;
    padding:4px 14px 14px;
    min-height:0;
  }
  .pad {
    border-radius:16px;
    background:linear-gradient(180deg, #1d1633, var(--panel));
    border:1px solid var(--edge);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    touch-action:none;
  }
  .pad .deg { font-size:24px; font-weight:800; }
  .pad .nm { font-size:10px; letter-spacing:0.2em; color:var(--dim); }
  .pad.active {
    background:linear-gradient(180deg, #3a2a68, #241a45);
    border-color:var(--sus);
    box-shadow:0 0 22px rgba(176,107,255,0.35), inset 0 0 18px rgba(176,107,255,0.15);
  }
  .pad.active.MAJOR { border-color:var(--maj); box-shadow:0 0 22px rgba(255,181,69,0.35), inset 0 0 18px rgba(255,181,69,0.12); }
  .pad.active.MINOR { border-color:var(--min); box-shadow:0 0 22px rgba(91,141,255,0.35), inset 0 0 18px rgba(91,141,255,0.12); }
  .pad:last-child { grid-column:1 / -1; }

  #boot {
    position:fixed; inset:0; z-index:30;
    background:rgba(13,10,22,0.95);
    display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  #boot p { font-size:13px; color:var(--dim); max-width:320px; line-height:1.55; }
  #boot button {
    padding:16px 32px; font-size:15px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase;
    background:linear-gradient(135deg, var(--maj), var(--sus));
    color:#0d0a16; border:none; border-radius:10px;
  }
  #boot.hidden { display:none; }
  #boot .err { color:#ff7a7a; font-size:12px; }
</style>
</head>
<body>

<div id="top">
  <div id="cam">
    <video id="video" autoplay playsinline muted></video>
    <div id="camstate">camera off</div>
  </div>
  <div id="expr">
    <div id="quality" class="SUS"><span class="face" id="face">&#128528;</span><span id="qname">SUS</span></div>
    <div id="moodtrack"><div id="moodcursor"></div></div>
    <div id="moodlabels"><span>frown = minor</span><span>neutral = sus</span><span>smile = major</span></div>
  </div>
</div>

<div id="arp">
  <button id="arp-toggle">Arp</button>
  <div class="apod">
    <label>Rate <output id="o-rate">6/s</output></label>
    <input type="range" id="s-rate" min="2" max="24" value="6">
  </div>
  <div class="apod">
    <label>Chaos <output id="o-chaos">0%</output></label>
    <input type="range" id="s-chaos" min="0" max="100" value="0">
  </div>
</div>

<div id="pads"></div>

<div id="boot">
  <p>Tap a chord pad to make it play, then conduct with your face: <b>smile for major, frown for minor, keep neutral for sus</b>. Open your mouth wide to make it bloom. Turn on the arp and crank the chaos.</p>
  <p id="booterr" class="err"></p>
  <button id="start">Camera on &middot; play</button>
</div>

<script type="module">
  // ---------- music ----------
  const ROOTS = [130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94]; // C3..B3
  const DEG   = ['I','II','III','IV','V','VI','VII'];
  const NAMES = ['C','D','E','F','G','A','B'];
  // voicing in semitones above root; index 3 is the "color" note:
  // major 16 (3rd+oct) / minor 15 / sus 17 (4th+oct)
  const VOICE = [0, 7, 12, 16, 19, 26];
  const COLOR_IDX = 3;
  const COLOR = { MAJOR:16, MINOR:15, SUS:17 };
  const VGAIN = [0.30, 0.22, 0.18, 0.26, 0.14, 0.07];

  const st = (f, semi) => f * Math.pow(2, semi/12);

  let ctx, master, filter, voices = [];   // per voice: {oscs:[o1,o2], gain}
  let chordIdx = -1, quality = 'SUS';
  let arpOn = false, arpRate = 6, chaos = 0;

  const $ = id => document.getElementById(id);

  function buildAudio() {
    ctx = new AudioContext({ latencyHint:'interactive' });
    filter = ctx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.value=1100; filter.Q.value=0.6;
    master = ctx.createGain(); master.gain.value=0.6;
    const comp = ctx.createDynamicsCompressor();
    filter.connect(master).connect(comp).connect(ctx.destination);

    for (let v=0; v<VOICE.length; v++) {
      const gain = ctx.createGain(); gain.gain.value = 0;
      gain.connect(filter);
      const oscs = [-6, 6].map(cents => {
        const o = ctx.createOscillator();
        o.type = 'sawtooth';
        o.detune.value = cents;
        o.frequency.value = 220;
        const g = ctx.createGain(); g.gain.value = 0.5;
        o.connect(g).connect(gain);
        o.start();
        return o;
      });
      voices.push({ oscs, gain });
    }
  }

  function chordFreqs() {
    const root = ROOTS[chordIdx];
    return VOICE.map((semi, i) => st(root, i===COLOR_IDX ? COLOR[quality] : semi));
  }

  function applyChord(smooth=true) {
    if (!ctx || chordIdx < 0) return;
    const t = ctx.currentTime, tc = smooth ? 0.03 : 0.005;
    const fs = chordFreqs();
    voices.forEach((v, i) => v.oscs.forEach(o => o.frequency.setTargetAtTime(fs[i], t, tc)));
  }

  function padOn() {
    const t = ctx.currentTime;
    voices.forEach((v,i) => v.gain.gain.setTargetAtTime(arpOn ? 0 : VGAIN[i], t, 0.09));
  }
  function padOff() {
    const t = ctx.currentTime;
    voices.forEach(v => v.gain.gain.setTargetAtTime(0, t, 0.18));
  }

  // ---------- arpeggiator: lookahead scheduler ----------
  let arpTimer = null, nextStep = 0, stepIdx = 0, dir = 1;
  function arpLoop() {
    if (!ctx) return;
    const ahead = 0.12;
    while (nextStep < ctx.currentTime + ahead) {
      if (chordIdx >= 0) {
        // up-down pattern with chaos: random voice / octave kicks
        let v = stepIdx;
        if (Math.random() < chaos) v = Math.floor(Math.random()*VOICE.length);
        const voice = voices[v];
        const fs = chordFreqs();
        let f = fs[v];
        if (Math.random() < chaos*0.5) f *= (Math.random()<0.5 ? 2 : 0.5);
        voice.oscs.forEach(o => o.frequency.setValueAtTime(f, nextStep));
        const g = voice.gain.gain;
        g.cancelScheduledValues(nextStep);
        g.setValueAtTime(0, nextStep);
        g.linearRampToValueAtTime(VGAIN[v]*1.5, nextStep + 0.008);
        g.setTargetAtTime(0, nextStep + 0.008, Math.min(0.28, 0.5/arpRate));
        // advance up-down
        stepIdx += dir;
        if (stepIdx >= VOICE.length-1) dir = -1;
        else if (stepIdx <= 0) dir = 1;
      }
      nextStep += 1/arpRate;
    }
  }
  function setArp(on) {
    arpOn = on;
    $('arp-toggle').classList.toggle('on', on);
    if (!ctx) return;
    if (on) {
      nextStep = ctx.currentTime + 0.05;
      stepIdx = 0; dir = 1;
      voices.forEach(v => v.gain.gain.setTargetAtTime(0, ctx.currentTime, 0.05));
      arpTimer = setInterval(arpLoop, 25);
    } else {
      clearInterval(arpTimer); arpTimer = null;
      if (chordIdx >= 0) { applyChord(false); padOn(); }
    }
  }

  // ---------- chord pads ----------
  const padsBox = $('pads');
  const padEls = [];
  ROOTS.forEach((_, i) => {
    const p = document.createElement('div');
    p.className='pad';
    p.innerHTML = `<div class="deg">${DEG[i]}</div><div class="nm">${NAMES[i]}</div>`;
    p.addEventListener('pointerdown', () => {
      if (!ctx) return;
      if (chordIdx === i) {           // tap active pad = stop
        chordIdx = -1;
        p.classList.remove('active');
        padOff();
        return;
      }
      padEls.forEach(x => x.classList.remove('active'));
      chordIdx = i;
      p.classList.add('active', quality);
      applyChord(chordIdx >= 0);
      if (!arpOn) padOn();
    });
    padsBox.appendChild(p);
    padEls.push(p);
  });

  function paintQuality() {
    const q = $('quality');
    q.className = quality;
    $('qname').textContent = quality === 'SUS' ? 'SUS' : quality;
    $('face').textContent = quality==='MAJOR' ? '\u{1F604}' : quality==='MINOR' ? '\u{2639}\uFE0F' : '\u{1F610}';
    padEls.forEach((p,i) => {
      if (i===chordIdx) { p.classList.remove('MAJOR','MINOR'); if (quality!=='SUS') p.classList.add(quality); }
    });
  }

  // ---------- face tracking ----------
  let landmarker = null, video = $('video');
  let smSmile = 0, smFrown = 0, smJaw = 0;

  async function initFace() {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const files = await vision.FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    landmarker = await vision.FaceLandmarker.createFromOptions(files, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      outputFaceBlendshapes: true,
      numFaces: 1
    });
  }

  const bs = (cats, name) => {
    const c = cats.find(x => x.categoryName === name);
    return c ? c.score : 0;
  };

  let lastVT = -1;
  function faceLoop() {
    requestAnimationFrame(faceLoop);
    if (!landmarker || video.readyState < 2) return;
    if (video.currentTime === lastVT) return;
    lastVT = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    if (!res.faceBlendshapes || !res.faceBlendshapes.length) return;
    const cats = res.faceBlendshapes[0].categories;

    const smile = (bs(cats,'mouthSmileLeft') + bs(cats,'mouthSmileRight')) / 2;
    const frown = Math.max(
      (bs(cats,'mouthFrownLeft') + bs(cats,'mouthFrownRight')) / 2,
      (bs(cats,'browDownLeft') + bs(cats,'browDownRight')) / 2 * 0.9);
    const jaw = bs(cats,'jawOpen');

    smSmile += (smile - smSmile)*0.3;
    smFrown += (frown - smFrown)*0.3;
    smJaw   += (jaw   - smJaw)*0.3;

    // mood axis: -1 frown ... +1 smile
    const mood = Math.max(-1, Math.min(1, smSmile*1.6 - smFrown*1.8));
    $('moodcursor').style.left = ((mood+1)/2*100) + '%';

    // quality with hysteresis so it doesn't flicker at boundaries
    let q = quality;
    if (quality !== 'MAJOR' && mood > 0.28) q = 'MAJOR';
    else if (quality !== 'MINOR' && mood < -0.22) q = 'MINOR';
    else if (quality === 'MAJOR' && mood < 0.14) q = 'SUS';
    else if (quality === 'MINOR' && mood > -0.10) q = 'SUS';
    if (q !== quality) {
      quality = q;
      paintQuality();
      applyChord();
    }

    // mouth open = bloom: filter opens wide, clear lift
    const jawAmt = Math.min(1, smJaw*1.7);
    if (ctx) {
      const t = ctx.currentTime;
      filter.frequency.setTargetAtTime(900 + jawAmt*5200, t, 0.05);
      master.gain.setTargetAtTime(0.55 + jawAmt*0.4, t, 0.05);
    }
    // visible feedback: mouth-open face + glow on the badge
    const faceEl = $('face');
    if (jawAmt > 0.35) {
      faceEl.textContent = '\u{1F62E}';
      faceEl.style.filter = `drop-shadow(0 0 ${Math.round(jawAmt*14)}px rgba(255,255,255,0.8))`;
    } else {
      faceEl.style.filter = '';
      faceEl.textContent = quality==='MAJOR' ? '\u{1F604}' : quality==='MINOR' ? '\u{2639}\uFE0F' : '\u{1F610}';
    }
  }

  // ---------- controls ----------
  $('arp-toggle').addEventListener('click', () => setArp(!arpOn));
  $('s-rate').addEventListener('input', e => { arpRate = +e.target.value; $('o-rate').textContent = arpRate+'/s'; });
  $('s-chaos').addEventListener('input', e => { chaos = +e.target.value/100; $('o-chaos').textContent = e.target.value+'%'; });

  // ---------- boot ----------
  $('start').addEventListener('click', async () => {
    try {
      buildAudio();
      await ctx.resume();
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:'user', width:{ideal:640}, height:{ideal:480} }, audio:false
      });
      video.srcObject = stream;
      $('camstate').classList.add('hidden');
      $('boot').classList.add('hidden');
      faceLoop();
      await initFace();   // model loads in background; loop picks it up when ready
    } catch (err) {
      $('booterr').textContent = 'Setup failed: ' + err.message +
        ' (camera permission? network for the face model?)';
    }
  });
</script>
</body>
</html>
